<!DOCTYPE html>
<html lang="de" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Physiotherapie Wirths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&display=swap" rel="stylesheet">
<script src="wao-local.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --tint:#EEF2F0; --ink:#000000; --soft:#5D625F;
  --pine:#1F9D55; --pine-ink:#FFFFFF; --line:#E3E6E4; --line-strong:#CDD4D0;
  --amber:#B8632E; --amber-bg:#FBEBDD; --ok:#17803F; --ok-bg:#E8F5EE; --bad:#B03A26; --bad-bg:#F8E2DB;
  --head:#000000; --headink:#FFFFFF;
  --r:12px; --serif:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --sans:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E100F;--surface:#161918;--tint:#1E2321;--ink:#F2F4F3;--soft:#9AA19D;--pine:#34C172;--pine-ink:#06130B;--line:#262A28;--line-strong:#363C39;--amber:#E0955F;--amber-bg:#3A2B20;--ok:#5BD48F;--ok-bg:#15281D;--bad:#E8927B;--bad-bg:#3B241E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E100F;--surface:#161918;--tint:#1E2321;--ink:#F2F4F3;--soft:#9AA19D;--pine:#34C172;--pine-ink:#06130B;--line:#262A28;--line-strong:#363C39;--amber:#E0955F;--amber-bg:#3A2B20;--ok:#5BD48F;--ok-bg:#15281D;--bad:#E8927B;--bad-bg:#3B241E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 80px}
h1,h2,h3{font-family:var(--serif);font-weight:700;font-stretch:85%;color:var(--ink);margin:0;letter-spacing:-.005em}
.whead{background:var(--head);color:var(--headink);padding:22px 18px 24px}
.brand{max-width:724px;margin:0 auto}
.wlogo{display:flex;align-items:center;gap:12px}
.wlogo b{background:#1F9D55;color:#fff;font-weight:800;font-size:20px;padding:8px 12px;letter-spacing:.02em;font-stretch:100%}
.wlogo small{font-size:13px;opacity:.75}
.brand h1{font-size:clamp(32px,8vw,46px);font-weight:800;font-stretch:80%;line-height:.95;color:#fff;margin:18px 0 0}
.brand p{margin:8px 0 0;color:#b9bfbc;font-size:.92rem}
nav.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px;margin-bottom:20px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav.tabs button{flex:1;border:0;background:none;color:var(--soft);font:500 .9rem var(--sans);padding:10px 6px;border-radius:9px;cursor:pointer}
nav.tabs button.on{background:var(--ink);color:var(--surface)}
nav.tabs button{font-weight:600!important}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.card h2{font-size:1.15rem;margin-bottom:12px}
.card h3{font-size:1rem;margin:18px 0 8px}
.muted{color:var(--soft);font-size:.88rem}
label{display:block;font-size:.83rem;color:var(--soft);margin:12px 0 4px}
input,select,textarea{width:100%;font:400 .95rem var(--sans);padding:10px 11px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--pine);outline-offset:1px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;background:var(--pine);color:var(--pine-ink);font:500 .92rem var(--sans);padding:11px 16px;border-radius:8px;cursor:pointer}
.btn.full{width:100%;margin-top:16px}
.btn:disabled{opacity:.5;cursor:default}
.btn2{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:500 .85rem var(--sans);padding:8px 12px;border-radius:8px;cursor:pointer}
.btn2.danger{color:var(--bad);border-color:var(--bad-bg)}
.lnk{background:none;border:0;color:var(--pine);font:500 .88rem var(--sans);cursor:pointer;padding:0}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -2px}
.day{flex:0 0 auto;min-width:74px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:center;cursor:pointer;font-family:var(--sans);color:var(--ink)}
.day b{display:block;font-size:.8rem;color:var(--soft);font-weight:500}
.day span{font-size:1.05rem;font-weight:600}
.day small{display:block;font-size:.72rem;color:var(--pine)}
.day.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.day.on b,.day.on small{color:var(--pine-ink)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.slot{border:1px solid var(--line-strong);background:var(--tint);border-radius:8px;padding:10px;font:500 .92rem var(--sans);color:var(--ink);cursor:pointer}
.slot.on{background:var(--pine);color:var(--pine-ink);border-color:var(--pine)}
.note{background:var(--ok-bg);color:var(--ok);border-radius:var(--r);padding:16px}
.code{font:600 1.35rem var(--sans);letter-spacing:3px;color:var(--ink);background:var(--surface);border:1px dashed var(--pine);border-radius:8px;padding:8px 14px;display:inline-block;margin:8px 0}
.gate{max-width:340px;margin:24px auto;text-align:center}
.gate input{text-align:center;letter-spacing:3px;font-size:1.1rem;text-transform:uppercase}
.err{color:var(--bad);font-size:.85rem;min-height:1.3em;margin-top:8px}
.brand h1{touch-action:manipulation;user-select:none;-webkit-user-select:none}.admin-tab{display:none}.show-admin .admin-tab{display:block}
details.sec{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--surface)}
details.sec>summary{cursor:pointer;padding:12px 14px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.sec>summary::after{content:'+';color:var(--soft);font-weight:400;font-size:1.2rem}details.sec[open]>summary::after{content:'–'}
details.sec>.in{padding:0 14px 14px}
.rom{width:100%;border-collapse:collapse;font-size:.88rem}.rom td,.rom th{padding:4px 3px;border-bottom:1px solid var(--line);text-align:left}
.rom th{color:var(--soft);font-weight:500;font-size:.78rem}.rom input,.rom select{padding:6px 6px;font-size:.88rem;margin:0;min-width:0;width:100%}
.rom td:first-child{width:38%}.rom td.n input{width:100%}
.bmap{display:flex;gap:10px;justify-content:center}.bmap figure{margin:0;text-align:center;flex:1;max-width:190px}
.bmap figcaption{font-size:.78rem;color:var(--soft)}.bmap svg{width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.painlist .item{padding:8px 0}
.trend{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:999px}.t-besser{background:var(--ok-bg);color:var(--ok)}.t-schlechter{background:var(--bad-bg);color:var(--bad)}.t-gleich{background:var(--tint);color:var(--soft)}
.cmp{overflow-x:auto}.cmp table{border-collapse:collapse;font-size:.84rem;min-width:100%}.cmp td,.cmp th{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}.cmp th{color:var(--soft);font-weight:500}
.agb{background:var(--tint);border-radius:10px;padding:10px 12px;font-size:.86rem;margin-top:12px}
.fin td.r,.fin th.r{text-align:right}.fin tr.tot td{font-weight:700;border-top:2px solid var(--line-strong)}
.fin .bar{height:6px;border-radius:3px;background:var(--pine);margin-top:3px}.fin .bar.o{background:var(--bad)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kpi div{background:var(--tint);border-radius:12px;padding:10px 12px}.kpi b{display:block;font-size:1.15rem;font-family:var(--serif)}.kpi span{font-size:.78rem;color:var(--soft)}
.neg{color:var(--bad)}.pos{color:var(--ok)}
.sub{overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch}.sub button{flex:0 0 auto}
.sent{font-size:.8rem;margin-top:5px;display:flex;align-items:center;gap:5px}.sent.ok{color:var(--ok)}.sent.wait{color:var(--amber)}
.done{text-align:center;padding:10px 0 4px}.done .ic{width:56px;height:56px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;font-size:1.7rem;margin:0 auto 10px}
.wheels{display:flex;gap:8px;justify-content:center;position:relative;margin:6px 0 4px;user-select:none;-webkit-user-select:none}
.wcol{flex:1;max-width:96px;text-align:center}.wcol .wl{font-size:.72rem;color:var(--soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.wheel{height:150px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;border-radius:12px;background:var(--tint);
  -webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}.wheel div{height:40px;line-height:40px;scroll-snap-align:center;font-size:1.25rem;font-variant-numeric:tabular-nums;color:var(--soft);transition:color .15s,transform .15s}
.wheel div.on{color:var(--ink);font-weight:700;transform:scale(1.12)}.wheel .pad{height:55px;scroll-snap-align:none}
.wcol .band{position:relative}.wcol .band::after{content:'';position:absolute;left:4px;right:4px;top:55px;height:40px;border-top:1.5px solid var(--pine);border-bottom:1.5px solid var(--pine);pointer-events:none;border-radius:4px}
.seg{display:flex;background:var(--tint);border-radius:10px;padding:3px;margin:4px 0 8px}.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;font:inherit;font-size:.86rem;color:var(--soft);cursor:pointer}.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.doseprev{text-align:center;font-weight:600;color:var(--pine);margin:6px 0 2px}
.prog{height:6px;background:var(--tint);border-radius:3px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--pine);width:0;transition:width .3s}
.xcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:0 0 22px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.xhead{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.xcat{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#fff;background:#1F9D55;padding:4px 10px;border-radius:4px}
.xhead h3{font-family:var(--serif);font-size:1.45rem;line-height:1.2;margin:10px 0 2px;color:var(--ink)}
.xsub{font-style:italic;color:var(--soft);font-size:.95rem}
.xmedia{margin:0;background:#EEF2F0;display:flex;justify-content:center;align-items:center;border-bottom:1px solid var(--line)}
.xmedia img,.xmedia video{display:block;width:auto;max-width:100%;height:auto;max-height:68vh;object-fit:contain;margin:0 auto;image-rendering:auto}
.xdose{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.xdose div{flex:1;min-width:80px;background:var(--tint);border-radius:12px;padding:10px 8px;text-align:center}
.xdose b{display:block;font-size:1.5rem;font-family:var(--serif);color:var(--pine);line-height:1.1}.xdose span{font-size:.8rem;color:var(--soft)}
.xdose .xtra{flex-basis:100%;background:none;padding:2px 0 0;text-align:left;font-size:.95rem;color:var(--ink)}
.xdays{padding:14px 18px;border-bottom:1px solid var(--line)}
.xdays h4{margin:0 0 8px;font-size:1rem;color:var(--ink)}
.xdays .row{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.xdays .row span{display:grid;place-items:center;aspect-ratio:1;max-height:44px;border-radius:50%;font:700 .85rem var(--sans);background:var(--tint);color:var(--soft);opacity:.55}
.xdays .row span.on{background:#1F9650;color:#fff;opacity:1}
.xdays p{margin:8px 0 0;font-size:.92rem;color:var(--ink)}
.xpts{padding:16px 18px 6px}.xpts h4{font-size:1.05rem;margin:0 0 12px;color:var(--ink)}
.xpts ol{list-style:none;margin:0;padding:0}.xpts li{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;margin:0 0 14px;font-size:1.06rem;line-height:1.45;color:var(--ink)}
.xpts li i{font-style:normal;width:32px;height:32px;border-radius:50%;background:#1F9650;color:#fff;font-weight:700;display:grid;place-items:center;font-size:1rem}
.xsafe{margin:4px 18px 18px;padding:12px 14px;border-radius:12px;background:#FFF4E5;color:#8A5A00;font-size:.95rem;display:flex;gap:10px;align-items:flex-start}
.xnote{margin:0 18px 18px;padding:12px 14px;border-radius:12px;background:var(--tint);font-size:.98rem}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xmedia{background:#1b201e}:root:not([data-theme="light"]) .xsafe{background:#3a2c12;color:#f3d29a}}
.xcatg{border-bottom:1px solid var(--line)}
.xcatg>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:18px 2px}
.xcatg>summary::-webkit-details-marker{display:none}
.xcatg>summary .cn{flex:1;font-size:clamp(24px,6.5vw,30px);font-weight:800;font-stretch:80%;color:var(--ink)}
.xcatg>summary .cc{font-size:13px;color:var(--soft)}
.xcatg>summary .cv{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--tint);transition:transform .25s,background .25s;flex:none}
.xcatg>summary .cv svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2}
.xcatg[open]>summary .cv{transform:rotate(180deg);background:#1F9D55}.xcatg[open]>summary .cv svg{stroke:#fff}
.xcatg>.xin{padding:0 0 14px}
.xcatg.sm>summary{padding:12px 2px}.xcatg.sm>summary .cn{font-size:1.15rem;font-stretch:85%}.xcatg.sm>summary .cv{width:28px;height:28px}
@media (prefers-reduced-motion:reduce){.xcatg>summary .cv{transition:none}}
.xgroup{font-size:.78rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--pine);margin:20px 0 8px;padding-bottom:6px;border-bottom:2px solid var(--pine)}
.xrow{display:grid;grid-template-columns:76px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.xrow .th{width:76px;height:76px;border-radius:12px;overflow:hidden;background:#EEF2F0;display:grid;place-items:center;color:var(--soft);font-size:.72rem}
.xrow .th img,.xrow .th video{width:100%;height:100%;object-fit:cover;display:block}
.xrow .t{font-weight:600;font-size:1.02rem;color:var(--ink)}.xrow .s{font-size:.84rem;color:var(--soft);margin-top:2px}.xrow .chev{color:var(--soft);font-size:1.3rem}
.xprev{border:2px dashed var(--line);border-radius:20px;padding:10px;margin-top:14px}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.sub button{border:1px solid var(--line-strong);background:var(--surface);color:var(--soft);font:500 .85rem var(--sans);padding:7px 13px;border-radius:999px;cursor:pointer}
.sub button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 13px;margin-bottom:9px;background:var(--surface)}
.item.click{cursor:pointer}
.item.click:hover{border-color:var(--pine)}
.itop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.iname{font-weight:600}
.imeta{color:var(--soft);font-size:.84rem}
.pill{font-size:.74rem;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-angefragt{background:var(--amber-bg);color:var(--amber)}
.p-bestaetigt{background:var(--ok-bg);color:var(--ok)}
.p-abgesagt{background:var(--bad-bg);color:var(--bad)}
.p-doku{background:var(--tint);color:var(--pine)}
a.btn2{text-decoration:none;display:inline-block}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.dayhead{font:600 .82rem var(--sans);color:var(--soft);margin:16px 0 7px}
.empty{color:var(--soft);font-size:.9rem;text-align:center;padding:18px 6px}
.timeline{border-left:2px solid var(--line-strong);margin-left:6px;padding-left:16px}
.tl{position:relative;margin-bottom:16px}
.tl:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pine)}
.tl.future:before{background:var(--surface);border:2px solid var(--pine)}
.tl h4{margin:0;font:600 .92rem var(--sans)}
.tl p{margin:4px 0 0;font-size:.88rem;white-space:pre-wrap}
.tl .k{color:var(--soft);font-size:.78rem;margin-top:6px}
.ex{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:start}
.ex .thumb{width:88px;height:88px;border-radius:8px;background:var(--tint);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--soft);font-size:.72rem;text-align:center;overflow:hidden}
.ex .thumb img,.ex .thumb video{width:100%;height:100%;object-fit:cover}
.exbig video,.exbig img{width:100%;border-radius:10px;margin:8px 0;max-height:360px;object-fit:contain;background:var(--tint)}
.dose{display:inline-block;background:var(--tint);color:var(--pine);font-size:.8rem;font-weight:500;padding:2px 8px;border-radius:6px;margin-top:4px}
.chk{display:flex;gap:9px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.chk input{width:auto;margin-top:3px}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
.stat div b{display:block;font-size:1.25rem;font-family:var(--serif)}
.stat div span{font-size:.78rem;color:var(--soft)}
.sheet{position:fixed;inset:0;background:rgba(20,32,27,.35);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.open{display:flex}
.sheet .panel{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:16px 16px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.avrow{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.avrow label{margin:0;display:flex;gap:6px;align-items:center;color:var(--ink);font-size:.9rem}
.avrow input[type=checkbox]{width:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
.bseg{margin:2px 0 6px}
.bpage{border:1px solid var(--line-strong);border-radius:12px;padding:8px 14px 14px;margin:18px 0 8px;position:relative}
.bpt{position:absolute;top:-10px;left:12px;background:var(--surface);padding:0 6px;font-size:.78rem;color:var(--soft);font-weight:600}
.bpage h3{margin:18px 0 2px;padding-top:14px;border-top:1px solid var(--line);color:var(--pine)}
.bpage h3:first-of-type{border-top:0;padding-top:4px}
.bkv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 2px}.bkv div{background:var(--tint);border-radius:10px;padding:8px 10px}.bkv span{display:block;font-size:.75rem;color:var(--soft)}.bkv b{font-weight:600}
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.bchips button{display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;font:500 .86rem var(--sans);cursor:pointer}
.bchips button.on{background:var(--pine);border-color:var(--pine);color:var(--pine-ink)}
.bchips i{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid var(--surface)}
.bmap2{display:flex;gap:6px;justify-content:center}.bmap2 figure{margin:0;flex:1;max-width:230px;text-align:center}.bmap2 figcaption{font-size:.78rem;color:var(--soft)}

function exParts(x){if(x.points&&x.points.length)return {pts:x.points.filter(Boolean),hint:x.hint??'',safe:x.safety??SAFE_DEFAULT};

/* ---------- slots ---------- */
function slotsFor(date){
  const cfg=S.settings.availability?.[String(new Date(date+'T12:00').getDay())];
  if(!cfg||!cfg.on) return [];
  const dur=+S.settings.duration||60, step=dur+(+S.settings.buffer||0), end=toMin(cfg.end);
  const out=[]; for(let t=toMin(cfg.start); t+dur<=end; t+=step) out.push(fromMin(t)); return out;
}
function freeSlots(date){
  const taken=new Set(S.appts.filter(a=>a.date===date&&a.status!=='abgesagt').map(a=>a.time));
  const now=new Date(), nowMin=now.getHours()*60+now.getMinutes();
  return slotsFor(date).filter(t=>!taken.has(t)&&!(date===today()&&toMin(t)<=nowMin+60));
}
function nextDays(n){const out=[];const d=new Date();for(let i=0;i<n;i++){const x=new Date(d);x.setDate(d.getDate()+i);out.push(ymd(x))}return out}

function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  const app=$('app');
  const keep=captureInputs();
  app.innerHTML = S.tab==='book'?viewBook():S.tab==='me'?viewMe():viewAdmin();
  restoreInputs(keep);
  try{bFunkLSIall()}catch(e){}
  const bwaSlot=document.getElementById('bwaSlot'); if(bwaSlot&&window.BWA) BWA.mount(bwaSlot);
}

function bFunkLSI(id){const t=FTESTS.find(x=>x[0]===id);const o=(S.bd.b.funk||{})[id]||{};const e=$('flsi_'+id);if(!e||!t[2]||!t[3])return;

      <div class="finf" id="finf_${id}" ${bOpen.has('fi'+id)?'':'hidden'}><p><b>Durchführung:</b> ${inf[0]}</p><p><b>Worauf achten:</b> ${inf[1]}</p><p><b>Norm:</b> ${inf[2]}</p></div>

function romFlags(m,e){const f=[];if(!e)return f;
  const a=istZ(e.aktiv)?+e.aktiv:null,p=istZ(e.passiv)?+e.passiv:null;
  const eng=(v,n)=>n!=null&&(n>=20?v<n*0.8:v<n-10);
  if(p!==null&&eng(p,m.normP))f.push(`passiv ${p}° (Norm ${m.normP}°)`);else if(a!==null&&eng(a,m.norm))f.push(`aktiv ${a}° (Norm ${m.norm}°)`);
  if(a!==null&&p!==null&&p-a>=15)f.push(`aktiv ${p-a}° unter passiv`);
  if(PATHO.includes(e.endgefuehl))f.push('Endgefühl '+e.endgefuehl);return f}
const mftFlags=e=>e&&SCHWACH.includes(e.grad)?['Kraftgrad '+e.grad]:[];
const bGet=(b,art,g,s,m)=>((b[art]||{})[g]||{})[s]?.[m];
function bFlags(b){const out=[];GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const ort=`${g.name}${SN[s]?' '+SN[s]:''} ${m.kurz}`;
  romFlags(m,bGet(b,'romAP',g.id,s,m.id)).forEach(f=>out.push({ort,f,art:'Beweglichkeit'}));
  mftFlags(bGet(b,'mft',g.id,s,m.id)).forEach(f=>out.push({ort,f,art:'Kraft'}))})));Object.entries(b.tests||{}).forEach(([t,v])=>['re','li'].forEach(k=>{if(v[k]==='pos.')out.push({ort:t+' '+k+'.',f:'positiv'+(v.n?' – '+v.n:''),art:NEURO_T.has(t)?'Neuro':'Ortho'})}));REFLEXE.forEach(([id,n,seg])=>{const v=(b.reflexe||{})[id];if(v)['re','li'].forEach(k=>{if(v[k]&&v[k]!=='normal')out.push({ort:n.replace(/ \(.*/,'')+' '+k+'.',f:v[k]+' ('+seg+')',art:'Neuro'})})});FTESTS.forEach(([id,name,seitig])=>{const o=(b.funk||{})[id];if(!o)return;(seitig?[['re','re.'],['li','li.']]:[['bew','']]).forEach(([k,l])=>{if(o[k]==='auffällig'||o[k]==='nicht möglich')out.push({ort:name+(l?' '+l:''),f:o[k]+(o.n?' – '+o.n:''),art:'Funktion'})})});return out}
function bStat(b,art,g){let n=0,w=0;SEITEN(g).forEach(s=>g.bew.forEach(m=>{const e=bGet(b,art,g.id,s,m.id);if(e)n++;w+=(art==='romAP'?romFlags(m,e):mftFlags(e)).length}));
  return n?`${n} erfasst${w?` · <span style="color:var(--amber);font-weight:600">${w} auffällig</span>`:''}`:''}

function bMapY(y){const P=[[0,0],[27,54],[34,64],[92,222],[188,428],[200,440]];for(let i=1;i<P.length;i++)if(y<=P[i][0]){const[a,b]=P[i-1],[c,d]=P[i];return Math.round(b+(y-a)/(c-a)*(d-b))}return 440}
/* Entwurf: alles wird sofort im Speicher gehalten und automatisch gesichert */
function bInit(p){
  if(S.bd&&S.bd.pid===p.id)return S.bd.b;
  if(S.bd&&S.bd.dirty)bSaveDraft(S.bd,true);
  const b=JSON.parse(JSON.stringify(p.bef||{}));
  b.romAP=b.romAP||{};b.mft=b.mft||{};b.regionen=b.regionen||{};b.atmung=b.atmung||{};b.tests=b.tests||{};b.funk=b.funk||{};b.reflexe=b.reflexe||{};
  if(!b.marker)b.marker=(b.pain||[]).map((x,i)=>({id:Date.now()+i,side:x.side,x:Math.round(100+(x.x-50)*1.6),y:bMapY(x.y),typ:'schmerz',label:x.label||'',vas:x.vas??null,art:x.art||''}));
  if(!b._migr){GELENKE.forEach(g=>g.bew.forEach(m=>{const o=m.alt&&(b.rom||{})[g.alt+'|'+m.alt];if(!o)return;
    SEITEN(g).forEach(s=>{const v=g.seitig?o[s]:(o.re||o.li);if(!istZ(v)&&!o.n)return;const num=istZ(v)&&!isNaN(+v);
      b.romAP[g.id]=b.romAP[g.id]||{};b.romAP[g.id][s]=b.romAP[g.id][s]||{};
      if(!b.romAP[g.id][s][m.id])b.romAP[g.id][s][m.id]={aktiv:num?+v:'',passiv:'',endgefuehl:'',notiz:[o.n,!num&&istZ(v)?v:''].filter(Boolean).join(', ')}})}));b._migr=1}
  if(b.schmerzWann===undefined&&b.verhalten)b.schmerzWann=b.verhalten;
  if(!b.datum)b.datum=today();
  S.bd={pid:p.id,b,tab:'deck',mtyp:'schmerz',dirty:false};return b}
function bSet(k,v){S.bd.b[k]=v;bDirty()}

async function bSaveDraft(d,auto){clearTimeout(d.t);const b=d.b;b.updated=today();delete b.pain;
  try{await S.db.doc('patients/'+d.pid).update({bef:JSON.parse(JSON.stringify(b)),verlauf:b.verlauf||'',updatedAt:Date.now()});d.dirty=false;
    const e=$('bfState');if(e&&S.bd===d)e.textContent='Gespeichert '+fmt(b.updated);if(!auto)toast('Befund gespeichert')}catch(e){toast('Speichern fehlgeschlagen')}}

async function snapshotBefund(id){if(!S.bd||S.bd.pid!==id)return;const b=S.bd.b;const p=S.patients.find(x=>x.id===id);
  const hist=[...(p.befHistory||[])].filter(h=>h.date!==today());
  hist.push({date:today(),romAP:b.romAP,mft:b.mft,tests:b.tests,funk:b.funk||{},reflexe:b.reflexe||{},nrs:b.nrs??null,verlauf:b.verlauf||''});
  b.updated=today();delete b.pain;
  try{await S.db.doc('patients/'+id).update({bef:JSON.parse(JSON.stringify(b)),befHistory:JSON.parse(JSON.stringify(hist))});S.bd.dirty=false;toast('Befund festgehalten')}catch(e){toast('Speichern fehlgeschlagen')}}
function befCompare(p){const hist=(p.befHistory||[]).slice(-5);
  const rows=[];
  rows.push(['max. Schmerz',h=>{if(h.nrs!=null)return h.nrs+'/10';const v=(h.pain||[]).map(x=>x.vas).filter(x=>x!=null);return v.length?Math.max(...v)+'/10':''}]);
  GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const lab=`${g.name}${SN[s]?' '+SN[s]:''} ${m.kurz}`;
    if(hist.some(h=>bGet(h,'romAP',g.id,s,m.id)))rows.push([lab,h=>{const e=bGet(h,'romAP',g.id,s,m.id);return e?[istZ(e.aktiv)&&'A '+e.aktiv+'°',istZ(e.passiv)&&'P '+e.passiv+'°'].filter(Boolean).join(' / '):''}]);
    if(hist.some(h=>bGet(h,'mft',g.id,s,m.id)))rows.push(['MFT '+lab,h=>bGet(h,'mft',g.id,s,m.id)?.grad||'']);})));
  [...new Set(hist.flatMap(h=>Object.keys(h.rom||{})))].forEach(k=>rows.push([k.replace('|',' '),h=>{const v=(h.rom||{})[k];return v?[v.re&&'re '+v.re+'°',v.li&&'li '+v.li+'°'].filter(Boolean).join(' / '):''}]));
  [...new Set(hist.flatMap(h=>Object.keys(h.tests||{})))].forEach(k=>rows.push([k,h=>{const v=(h.tests||{})[k];return v?[v.re&&'re '+v.re,v.li&&'li '+v.li].filter(Boolean).join(' / '):''}]));
  FTESTS.forEach(([id,name,seitig,unit])=>{if(!hist.some(x=>(x.funk||{})[id]))return;const u=unit?' '+unit:'';const sh=(o,k,w)=>[o[k]==='unauffällig'?'o.B.':o[k]==='auffällig'?'auff.':o[k]==='nicht möglich'?'n. mögl.':'',istZ(o[w])?o[w]+u:''].filter(Boolean).join(' ');
    rows.push([name,x=>{const o=(x.funk||{})[id];if(!o)return'';return seitig?[sh(o,'re','wre')&&'re '+sh(o,'re','wre'),sh(o,'li','wli')&&'li '+sh(o,'li','wli')].filter(Boolean).join(' / '):sh(o,'bew','wert')}])});
  return `<h3 style="margin-top:18px">Befund-Vergleich</h3><div class="cmp"><table><tr><th></th>${hist.map(h=>`<th>${fmt(h.date).slice(0,6)}</th>`).join('')}</tr>
  ${rows.map(([l,f])=>`<tr><td>${esc(l)}</td>${hist.map(h=>`<td>${esc(f(h))}</td>`).join('')}</tr>`).join('')}</table></div>`}

const F_TOES=[[88,40,11,15],[69,36,6,9],[56,38,5.5,8],[44,43,5,7],[33,50,4.5,6]];
function bFoot(side){const ms=(S.bd.b.marker||[]).filter(m=>m.side===side);const pl=side[1]==='p';
  // Rechte Sohle: Großzehe rechts im Bild; linke Sohle und rechter Fußrücken gespiegelt
  const flip=(side==='fpl'||side==='fdr');const tf=flip?'transform="translate(120 0) scale(-1 1)"':'';
  const toes=F_TOES.map(([x,y,rx,ry])=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" class="bk"/>`).join('');
  const det=pl?'<path d="M42 212 Q58 222 76 212 M30 92 Q62 80 100 90"/><path d="M90 120 Q80 145 82 170" stroke-dasharray="2 3"/>'
    :F_TOES.map(([x,y,rx,ry])=>`<path d="M${x-rx*.55} ${y-ry*.35} Q${x} ${y-ry*.8} ${x+rx*.55} ${y-ry*.35}"/>`).join('')+'<path d="M88 62 L66 150 M69 52 L60 150 M56 54 L55 150 M44 58 L50 150 M33 62 L45 150" stroke-dasharray="2 4"/><path d="M40 196 Q58 186 80 196"/>';
  const med=flip?14:106,lat=flip?106:14;

  <g ${tf}><g onclick="bAddMark(event,'${side}')" style="cursor:crosshair"><path d="${F_PATH}" class="bk"/>${toes}</g><g class="bdet">${det}</g></g>
  <text x="${med}" y="236" class="bsd" text-anchor="middle" style="font-size:9px">innen</text><text x="${lat}" y="236" class="bsd" text-anchor="middle" style="font-size:9px">außen</text>

function bAddMark(ev,side){const svg=ev.currentTarget.ownerSVGElement||ev.currentTarget.closest('svg');const pt=svg.createSVGPoint();pt.x=ev.clientX;pt.y=ev.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse());
  S.bd.b.marker=[...(S.bd.b.marker||[]),{id:Date.now(),side,x:Math.round(q.x),y:Math.round(q.y),typ:S.bd.mtyp,label:'',vas:null}];bDirty();render()}

function bDelMark(){S.bd.b.marker=S.bd.b.marker.filter(x=>x.id!==S.bm.id);closeSheet();bDirty();render()}
function bReg(r,k,v){S.bd.b.regionen={...S.bd.b.regionen,[r]:{...(S.bd.b.regionen[r]||{}),[k]:v}};bDirty()}

function bTest(i,k,v){const t=TESTS[i];const o={...(S.bd.b.tests[t]||{}),[k]:v};if(!o.re&&!o.li&&!o.n)delete S.bd.b.tests[t];else S.bd.b.tests[t]=o;bDirty()}

  <div class="bmap2"><figure>${bBody('v')}<figcaption>vorne</figcaption></figure><figure>${bBody('h')}<figcaption>hinten</figcaption></figure></div>

  <div class="bmap2 bfeet"><figure>${bFoot('fpr')}<figcaption>Sohle rechts</figcaption></figure><figure>${bFoot('fpl')}<figcaption>Sohle links</figcaption></figure><figure>${bFoot('fdr')}<figcaption>Rücken rechts</figcaption></figure><figure>${bFoot('fdl')}<figcaption>Rücken links</figcaption></figure></div>`:''}

  ${ms.length?`<div class="painlist">${ms.map(m=>`<div class="item click" onclick="bEditMark(${m.id})"><div class="iname" style="font-size:.9rem">${MTYP[m.typ]?.l||''}${m.label?': '+esc(m.label):''}${m.vas!=null?` · ${m.vas}/10`:''}</div><div class="imeta">${MSEITE(m.side)}${m.art?' · '+esc(m.art):''}</div></div>`).join('')}</div>`:''}
  <h3>Narben und Schmerz nach Region</h3>

  ${REGIONEN.map(([r,n])=>`<tr><td>${n}</td>${['narbeRe','narbeLi','schmerzRe','schmerzLi'].map(k=>`<td class="c"><input type="checkbox" aria-label="${n} ${k}" ${(b.regionen[r]||{})[k]?'checked':''} onchange="bReg('${r}','${k}',this.checked)"></td>`).join('')}</tr>`).join('')}</table></div>

  <label>Stärke (NRS 0–10)</label><div class="bnrs">${Array.from({length:11},(_,i)=>`<button type="button" class="${b.nrs===i?'on':''}" onclick="bNrs(${i})">${i}</button>`).join('')}</div>

  ${b.kraft?bTA('kraft','Kraft (frühere Notizen)','',52):''}

/* Gelenke: Aktiv/Passiv und MFT */
function bJoints(b,art){
  return `<p class="muted" style="margin:6px 0 8px">${art==='romAP'?'Gelenk öffnen und auf ein Feld tippen. Aktiv, passiv und Endgefühl stellst du über die Räder ein.':'Gelenk öffnen und auf ein Feld tippen. Den Kraftgrad stellst du über das Rad ein.'}</p>`+
  GELENKE.filter(g=>bShow('g',g.id,bJointHas(b,g.id))).map(g=>{const sides=SEITEN(g);const cls=g.seitig?'two':'one';
    const cls2=cls+(art==='romAP'?' nrm':'');const inner=`<div class="bjr bjh ${cls2}"><span>Bewegung</span>${art==='romAP'?'<span>Norm<br>aktiv</span><span>Norm<br>passiv</span>':''}${sides.map(s=>`<span>${s==='m'?'Wert':s==='re'?'Rechts':'Links'}</span>`).join('')}</div>`+
      g.bew.map(m=>`<div class="bjr ${cls2}"><div class="bjb"><b>${m.kurz}</b><small>${m.name}</small></div>${art==='romAP'?`<span class="bjn">${m.norm!=null?m.norm+'°':'–'}</span><span class="bjn">${m.normP!=null?m.normP+'°':'–'}</span>`:''}${sides.map(s=>{const e=bGet(b,art,g.id,s,m.id);const fl=art==='romAP'?romFlags(m,e):mftFlags(e);
        return `<button type="button" class="bjc ${e?'full':''} ${fl.length?'warn':''}" onclick="bOpenVal('${art}','${g.id}','${s}','${m.id}')">${!e?'<span class="pl">+</span>':art==='romAP'
          ?`<span>A ${istZ(e.aktiv)?e.aktiv+'°':'–'}</span><span>P ${istZ(e.passiv)?e.passiv+'°':'–'}</span>${e.endgefuehl?`<small>${e.endgefuehl}</small>`:''}`
          :`<span class="gr">${e.grad}</span>`}</button>`}).join('')}</div>`).join('');
    return sec(art+'-'+g.id,g.name,inner,bStat(b,art,g))}).join('')}

/* Drehräder im Eingabe-Blatt */
function bWheel(k,label,vals,cur,fmtv,wide,toggle){const i=Math.max(0,vals.indexOf(cur));S.bvv[k]=vals;
  return `<div class="wcol ${wide?'wide':''}">${toggle?`<button type="button" class="bwt ${S.bv[k+'On']?'on':''}" id="bwt_${k}" onclick="bToggle('${k}')">${label}</button>`:`<div class="wl">${label}</div>`}
  <div class="band ${toggle&&!S.bv[k+'On']?'boff':''}" id="bwb_${k}"><div class="wheel" data-k="${k}" data-i="${i}" onscroll="bWheelScroll(this)">
  <div class="pad"></div>${vals.map((v,j)=>`<div class="${j===i?'on':''}" onclick="wheelTo(this.parentNode,${j})">${fmtv?fmtv(v):v}</div>`).join('')}<div class="pad"></div></div></div></div>`}
function bWheelScroll(w){clearTimeout(w._t);const k=w.dataset.k;const vals=S.bvv[k];const j=Math.max(0,Math.min(vals.length-1,Math.round(w.scrollTop/40)));
  const items=w.querySelectorAll('div:not(.pad)');if(+w.dataset.i!==j){items[+w.dataset.i]?.classList.remove('on');items[j]?.classList.add('on');w.dataset.i=j;if(navigator.vibrate)try{navigator.vibrate(4)}catch(e){}}
  S.bv[k]=vals[j]}
function bToggle(k){S.bv[k+'On']=!S.bv[k+'On'];$('bwt_'+k).classList.toggle('on',S.bv[k+'On']);$('bwb_'+k).classList.toggle('boff',!S.bv[k+'On'])}
function bOpenVal(art,gid,s,mid){const g=GELENKE.find(x=>x.id===gid),m=g.bew.find(x=>x.id===mid);const e=bGet(S.bd.b,art,gid,s,mid)||{};
  const titel=`${g.name}${s!=='m'?(s==='re'?' rechts':' links'):''}`;S.bvv={};
  if(art==='romAP'){const max=Math.min(200,Math.max(60,Math.ceil(((m.normP||m.norm||90)*1.5)/5)*5));const vals=range(-30,max,5);
    const st=(v,n)=>istZ(v)?Math.round(+v/5)*5:(n!=null?Math.round(n/5)*5:0);
    S.bv={art,gid,s,mid,a:st(e.aktiv,m.norm),p:st(e.passiv,m.normP),eg:e.endgefuehl||'',aOn:istZ(e.aktiv)||!istZ(e.passiv),pOn:istZ(e.passiv)||!istZ(e.aktiv)};
    openSheet(sheetHead(titel)+`<p class="muted" style="margin:0 0 6px">${m.name}${m.norm!=null?' · Norm aktiv '+m.norm+'°, passiv '+m.normP+'°':''}</p>
    <div class="wheels">${bWheel('a','Aktiv',vals,S.bv.a,v=>v+'°',false,true)}${bWheel('p','Passiv',vals,S.bv.p,v=>v+'°',false,true)}${bWheel('eg','Endgefühl',ENDGEF,S.bv.eg,v=>v||'–',true)}</div>
    <label for="bv_n">Anmerkung</label><input id="bv_n" value="${esc(e.notiz||'')}" placeholder="z. B. Schmerz bei 90°, Ausweichbewegung">
    <div class="bact"><button class="btn2 danger" onclick="bApplyVal(true)">Werte löschen</button><button class="btn" onclick="bApplyVal()">Übernehmen</button></div>`)}
  else{S.bv={art,gid,s,mid,grad:e.grad||'5'};
    openSheet(sheetHead(titel)+`<p class="muted" style="margin:0 0 6px">MFT ${m.name}</p>
    <div class="wheels">${bWheel('grad','Kraftgrad',KRAFT,S.bv.grad)}</div>
    <p class="muted" style="font-size:.8rem;margin:6px 0 0">0 keine Aktivität · 1 sichtbare Kontraktion · 2 ohne Schwerkraft · 3 gegen Schwerkraft · 4 gegen mäßigen Widerstand · 5 normal</p>
    <label for="bv_n">Anmerkung</label><input id="bv_n" value="${esc(e.notiz||'')}" placeholder="z. B. Schmerz bei Widerstand, Ausweichen">
    <div class="bact"><button class="btn2 danger" onclick="bApplyVal(true)">Wert löschen</button><button class="btn" onclick="bApplyVal()">Übernehmen</button></div>`)}
  setTimeout(()=>document.querySelectorAll('#sheetBody .wheel[data-k]').forEach(w=>{w.scrollTop=(+w.dataset.i)*40}),0)}
function bApplyVal(clear){const v=S.bv;const b=S.bd.b;const notiz=($('bv_n')?.value||'').trim();
  b[v.art][v.gid]=b[v.art][v.gid]||{};b[v.art][v.gid][v.s]=b[v.art][v.gid][v.s]||{};
  if(clear)delete b[v.art][v.gid][v.s][v.mid];
  else b[v.art][v.gid][v.s][v.mid]=v.art==='romAP'?{aktiv:v.aOn?v.a:'',passiv:v.pOn?v.p:'',endgefuehl:v.eg,notiz}:{grad:v.grad,notiz};
  closeSheet();bDirty();render()}

const MFTNUM=g=>{if(!istZ(g))return null;const n=parseFloat(g);return isNaN(n)?null:n+(String(g).endsWith('+')?.3:String(g).endsWith('-')?-.3:0)};
function bChart(title,dates,series,unit,norm){
  const W=320,H=120,L=30,R=10,T=18,B=22;const all=series.flatMap(s=>s.v.filter(x=>x!=null));if(norm!=null)all.push(norm);
  let lo=Math.min(...all),hi=Math.max(...all);if(hi-lo<1){hi+=1;lo-=1}const pad=(hi-lo)*.15;lo=Math.floor(Math.max(0,lo-pad));hi=Math.ceil(hi+pad);
  const X=i=>L+(dates.length<2?0:i*(W-L-R)/(dates.length-1)),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  const fm=v=>Math.round(v*10)/10;
  return `<figure class="bch"><figcaption>${esc(title)}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">
  <line x1="${L}" y1="${H-B}" x2="${W-R}" y2="${H-B}" class="ax"/><text x="${L-4}" y="${Y(hi)+4}" class="tk" text-anchor="end">${fm(hi)}</text><text x="${L-4}" y="${H-B}" class="tk" text-anchor="end">${fm(lo)}</text>
  ${norm!=null?`<line x1="${L}" x2="${W-R}" y1="${Y(norm)}" y2="${Y(norm)}" class="nl"/><text x="${W-R}" y="${Y(norm)-3}" class="tk" text-anchor="end">Norm ${norm}${unit}</text>`:''}
  ${dates.map((d,i)=>`<text x="${X(i)}" y="${H-6}" class="tk" text-anchor="middle">${fmt(d).slice(0,6)}</text>`).join('')}
  ${series.map((s,si)=>{const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v),v]).filter(Boolean);
    return `<polyline points="${pts.map(q=>q[0]+','+q[1]).join(' ')}" fill="none" stroke="${s.c}" stroke-width="2"/>${pts.map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="3" fill="${s.c}"/>`).join('')}<text x="${pts[pts.length-1][0]}" y="${pts[pts.length-1][1]+(series.length>1&&si===0?15:-6)}" class="tv" fill="${s.c}" text-anchor="${pts.length>1?'end':'middle'}">${fm(pts[pts.length-1][2])}${unit}</text>`}).join('')}
  </svg>${series.length>1?`<div class="blg">${series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}</span>`).join('')}</div>`:''}</figure>`}
function befCurves(p){const hist=(p.befHistory||[]).slice(-8);if(hist.length<2)return'';const d=hist.map(x=>x.date);const ch=[];
  const two=v=>v.filter(x=>x!=null).length>=2;const num=v=>istZ(v)&&!isNaN(+v)?+v:null;
  const nrs=hist.map(x=>x.nrs??null);if(two(nrs))ch.push(bChart('Schmerz (NRS)',d,[{n:'NRS',c:'var(--bad)',v:nrs}],'',null));
  GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const lab=`${g.name}${SN[s]?' '+SN[s]:''} ${m.name}`;
    const a=hist.map(x=>num(bGet(x,'romAP',g.id,s,m.id)?.aktiv)),pp=hist.map(x=>num(bGet(x,'romAP',g.id,s,m.id)?.passiv));
    const ser=[two(a)&&{n:'aktiv',c:'var(--pine)',v:a},two(pp)&&{n:'passiv',c:'var(--amber)',v:pp}].filter(Boolean);
    if(ser.length)ch.push(bChart(lab,d,ser,'°',m.norm));
    const k=hist.map(x=>MFTNUM(bGet(x,'mft',g.id,s,m.id)?.grad));if(two(k))ch.push(bChart('MFT '+lab,d,[{n:'Kraftgrad',c:'var(--pine)',v:k}],'',5))})));
  FTESTS.forEach(([id,name,seitig,unit])=>{if(!unit)return;const g=k=>hist.map(x=>num(((x.funk||{})[id]||{})[k]));
    const ser=seitig?[two(g('wre'))&&{n:'rechts',c:'var(--pine)',v:g('wre')},two(g('wli'))&&{n:'links',c:'var(--amber)',v:g('wli')}].filter(Boolean):(two(g('wert'))?[{n:name,c:'var(--pine)',v:g('wert')}]:[]);
    if(ser.length)ch.push(bChart(name,d,ser,' '+unit,null))});
  if(!ch.length)return'';
  return sec('bkurv','Verlaufskurven',`<div class="bchs">${ch.join('')}</div>`,ch.length+' Kurven')}

const JOINT_FOK={hws:'hws',rumpf:'lws',schulter:'schulter',ellenbogen:'hand',hand:'hand',huefte:'huefte',knie:'knie',fuss:'fuss'};
const FUNK_FOK={kniebeuge:['knie','huefte'],ebkb:['knie','huefte'],ausfall:['knie'],treppe:['knie'],sts:['huefte','knie'],tug:['fuss'],hop:['knie','fuss'],zehenstand:['fuss'],fersenstand:['fuss'],fba:['lws'],nackengriff:['schulter'],schuerzengriff:['schulter']};
function bExSuggest(p,b){const fk=new Set(bFok());
  GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{if(romFlags(m,bGet(b,'romAP',g.id,s,m.id)).length||mftFlags(bGet(b,'mft',g.id,s,m.id)).length)fk.add(JOINT_FOK[g.id])})));
  Object.entries(b.funk||{}).forEach(([id,o])=>{if(['re','li','bew'].some(k=>o[k]==='auffällig'||o[k]==='nicht möglich'))(FUNK_FOK[id]||[]).forEach(x=>fk.add(x))});
  fk.delete(undefined);if(!fk.size)return {fk:[],list:[]};
  const kw=[...fk].flatMap(f=>FOKUS_MAP[f].kw);const have=new Set((p.assigned||[]).map(a=>a.exerciseId));
  const list=(S.exercises||[]).filter(e=>!have.has(e.id)).map(e=>{const t=[e.title,e.category,e.subtitle,e.tags].flat().filter(Boolean).join(' ').toLowerCase();return [e,kw.filter(k=>t.includes(k)).length]}).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);
  return {fk:[...fk],list}}
function bExBlock(p,b){const {fk,list}=bExSuggest(p,b);const nm=k=>(FOKUS.find(x=>x[0]===k)||[])[1];
  if(!fk.length)return `<p class="muted" style="margin:4px 0 8px">Übungsvorschläge erscheinen, sobald du oben einen Schwerpunkt wählst oder Auffälligkeiten einträgst.</p>`;
  if(!list.length)return `<p class="muted" style="margin:4px 0 8px">Für ${fk.map(nm).join(', ')} habe ich in deinem Katalog keine passenden, noch nicht freigegebenen Übungen gefunden.</p>`;
  return `<p class="muted" style="margin:4px 0 6px">Passend zu: ${fk.map(nm).join(', ')}</p><div class="bexs">${list.map(e=>`<label class="chk"><input type="checkbox" name="bsx" value="${e.id}"><span><b>${esc(e.title)}</b>${e.category?` <span class="muted">· ${esc(e.category)}</span>`:''}</span></label>`).join('')}</div>
  <button class="btn2" style="width:100%;margin-top:6px" onclick="(async()=>{const ids=[...document.querySelectorAll('input[name=bsx]:checked')].map(i=>i.value);if(!ids.length){toast('Erst Übungen anhaken');return}await assignExercises('${p.id}',ids,'');toast('Übungen freigegeben')})()">Angehakte Übungen freigeben</button>`}

function bReportText(p,b){const L=[];const add=(t,x)=>{x=(Array.isArray(x)?x.filter(Boolean).join('\n'):x)||'';if(x.trim()){L.push(t+':');L.push(x.trim());L.push('')}};
  const P=(S.settings&&S.settings.praxis)||{};

  add('Anamnese',[b.anamnese,b.vorerkrankungen&&'Vorerkrankungen: '+b.vorerkrankungen,b.operationen&&'Operationen/Unfälle: '+b.operationen,b.ziele&&'Ziel des Patienten: '+b.ziele]);
  add('Schmerz',[b.schmerzWo&&'Lokalisation: '+b.schmerzWo,b.schmerzWann&&'Auftreten: '+b.schmerzWann,b.schmerzArt&&'Qualität: '+b.schmerzArt,b.schmerzProv&&'Provokation: '+b.schmerzProv,b.nrs!=null&&'Stärke: NRS '+b.nrs+'/10']);
  add('Inspektion / Palpation',[b.inspektion,b.palpation]);
  const rom=[];GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const e=bGet(b,'romAP',g.id,s,m.id);if(!e||(!istZ(e.aktiv)&&!istZ(e.passiv)))return;
    rom.push(`${g.name}${SN[s]?' '+SN[s]:''} ${m.name}: ${[istZ(e.aktiv)&&'aktiv '+e.aktiv+'°',istZ(e.passiv)&&'passiv '+e.passiv+'°'].filter(Boolean).join(', ')} (Norm ${m.norm??'–'}°/${m.normP??'–'}°)${e.endgefuehl?', Endgefühl '+e.endgefuehl:''}`)})));
  add('Beweglichkeit (Neutral-Null)',rom);
  const mf=[];GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const e=bGet(b,'mft',g.id,s,m.id);if(e&&istZ(e.grad))mf.push(`${g.name}${SN[s]?' '+SN[s]:''} ${m.name}: ${e.grad}/5`)})));
  add('Muskelfunktionstest',mf);
  const tst=neuro=>{const tp=[],tn=[];Object.entries(b.tests||{}).filter(([t])=>NEURO_T.has(t)===neuro).forEach(([t,v])=>{['re','li'].forEach(k=>{if(v[k]==='pos.')tp.push(`${t} ${k}.${v.n?' ('+v.n+')':''}`);else if(v[k]==='neg.')tn.push(`${t} ${k}.`)})});return [tp.length&&'Positiv: '+tp.join('; '),tn.length&&'Negativ: '+tn.join('; ')]};
  add('Orthopädische Tests',[...tst(false),b.testsSonst]);
  const rf=REFLEXE.map(([id,n,seg])=>{const v=(b.reflexe||{})[id];if(!v)return'';return `${n.replace(/ \(.*/,'')} (${seg}): ${[v.re&&'re. '+v.re,v.li&&'li. '+v.li].filter(Boolean).join(', ')}`}).filter(Boolean);
  add('Neurologische Untersuchung',[...tst(true),rf.length&&'Reflexe: '+rf.join('; '),b.neuro]);
  const ft=[];FTESTS.forEach(([id,name,seitig,unit])=>{const o=(b.funk||{})[id];if(!o)return;const one=(k,w,l)=>o[k]||istZ(o[w])?l+[o[k],istZ(o[w])&&o[w]+' '+unit].filter(Boolean).join(' '):'';
    const t=seitig?[one('re','wre','re. '),one('li','wli','li. ')].filter(Boolean).join(', '):one('bew','wert','');if(t||o.n)ft.push(`${name}: ${t}${o.n?' ('+o.n+')':''}`)});
  add('Funktion',[b.gang&&'Gang: '+b.gang,...ft,b.funktion]);
  add('Muskellänge',b.muskellaenge);
  const hist=p.befHistory||[];if(hist.length>=2){const a=hist[0],z=hist[hist.length-1];const ch=[];
    if(a.nrs!=null&&z.nrs!=null&&a.nrs!==z.nrs)ch.push(`Schmerz NRS ${a.nrs} → ${z.nrs}`);
    GELENKE.forEach(g=>SEITEN(g).forEach(s=>g.bew.forEach(m=>{const x=bGet(a,'romAP',g.id,s,m.id),y=bGet(z,'romAP',g.id,s,m.id);['aktiv','passiv'].forEach(k=>{if(x&&y&&istZ(x[k])&&istZ(y[k])&&+x[k]!==+y[k])ch.push(`${g.name}${SN[s]?' '+SN[s]:''} ${m.name} ${k} ${x[k]}° → ${y[k]}°`)})})));
    add(`Verlauf (${fmt(a.date)} bis ${fmt(z.date)})`,ch.slice(0,12))}
  add('Physiotherapeutische Einschätzung',[b.hypothese,b.einschraenkungen&&'Einschränkungen: '+b.einschraenkungen]);

const INC_CATS=['Behandlung ohne Rechnung','Sonstige Einnahme'];
const MON=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const paidDate=i=>i.paidAt||i.date;
function finData(y){y=String(y);
  const inv=S.invoices.filter(i=>i.status==='bezahlt'&&(paidDate(i)||'').startsWith(y)).map(i=>({date:paidDate(i),amount:+i.total,cat:'Rechnung '+i.number,note:i.patientName,kind:'ein',src:'inv'}));
  const man=S.finance.filter(f=>(f.date||'').startsWith(y)).map(f=>({...f,amount:+f.amount}));
  const ein=[...inv,...man.filter(f=>f.kind==='ein')],aus=man.filter(f=>f.kind==='aus');
  const months=MON.map((m,i)=>{const k=y+'-'+String(i+1).padStart(2,'0');const e=ein.filter(x=>x.date.startsWith(k)).reduce((s,x)=>s+x.amount,0),a=aus.filter(x=>x.date.startsWith(k)).reduce((s,x)=>s+x.amount,0);
    const o=S.invoices.filter(x=>x.status!=='bezahlt'&&(x.date||'').startsWith(k)).reduce((s,x)=>s+(+x.total),0);return {m,e,a,o}});
  return {ein,aus,months}}
function viewFinance(){const y=S.finYear;const {ein,aus,months}=finData(y);
  const E=ein.reduce((s,x)=>s+x.amount,0),A=aus.reduce((s,x)=>s+x.amount,0);
  const open=S.invoices.filter(i=>i.status!=='bezahlt'),overdue=open.filter(i=>i.faellig&&i.faellig<today());
  const notBilled=S.patients.reduce((s,p)=>s+unbilled(p.id).reduce((t,a)=>t+lineOf(a).preis,0),0);
  const max=Math.max(1,...months.map(m=>Math.max(m.e,m.a)));

/* ---------- Dosierung-Drehregler ---------- */
const range=(a,b,s=1)=>{const r=[];for(let i=a;i<=b;i+=s)r.push(i);return r};
const DOSE_COLS={sets:range(1,10),reps:range(1,50),secs:[...range(5,60,5),...range(75,300,15)],perDay:range(1,5)};
function doseText(s){if(!s)return '';const main=s.mode==='secs'?`${s.sets} × ${s.secs>=60&&s.secs%60===0?s.secs/60+' Min':s.secs+' Sek'}`:`${s.sets} × ${s.reps} Wdh`;
  return main+(s.side?' '+s.side:'')}
function wheel(pre,key,label,vals,cur,fmtv){const i=Math.max(0,vals.indexOf(cur));
  return `<div class="wcol"><div class="wl">${label}</div><div class="band"><div class="wheel" id="${pre}_w_${key}" data-vals="${vals.join(',')}" data-i="${i}" onscroll="wheelScroll(this,'${pre}')">
  <div class="pad"></div>${vals.map((v,j)=>`<div class="${j===i?'on':''}" onclick="wheelTo(this.parentNode,${j})">${fmtv?fmtv(v):v}</div>`).join('')}<div class="pad"></div></div></div></div>`}
function dosePicker(pre,spec,fallback,days){const s={mode:'reps',sets:3,reps:12,secs:30,perDay:1,side:'',...(spec||{})};S['dp_'+pre]=s;
  setTimeout(()=>initWheels(pre),0);
  return `<div id="${pre}_dp"><div class="seg">${[['reps','Wiederholungen'],['secs','Sekunden']].map(([k,l])=>`<button type="button" class="${s.mode===k?'on':''}" onclick="doseMode('${pre}','${k}',this)">${l}</button>`).join('')}</div>
  <div class="wheels">${wheel(pre,'sets','Sätze',DOSE_COLS.sets,s.sets)}
  <div id="${pre}_wrap_reps" style="display:${s.mode==='reps'?'contents':'none'}">${wheel(pre,'reps','Wdh.',DOSE_COLS.reps,s.reps)}</div>
  <div id="${pre}_wrap_secs" style="display:${s.mode==='secs'?'contents':'none'}">${wheel(pre,'secs','Sek.',DOSE_COLS.secs,s.secs,v=>v>=60&&v%60===0?v/60+'′':v)}</div>
  </div>${days!==undefined?dayPicker(pre,days):''}
  <div class="seg" style="margin-top:8px">${[['','beidseitig egal'],['je Seite','je Seite']].map(([k,l])=>`<button type="button" class="${s.side===k?'on':''}" onclick="S['dp_${pre}'].side='${k}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on');doseUpd('${pre}')">${l}</button>`).join('')}</div>
  <div class="doseprev" id="${pre}_prev">${esc(doseText(s))}</div>
  <label for="${pre}_extra" style="margin-top:6px">Zusatz (optional)</label><input id="${pre}_extra" value="${esc(spec?.extra??(spec?'':fallback||''))}" placeholder="z. B. langsam absenken, 1 Min Pause"></div>`}
function dayPicker(pre,days){const on=d=>days&&days.length<7&&days.includes(d);
  return `<label style="margin-top:10px">Wochentage</label><div class="dchips" id="${pre}_days">${DORDER.map(d=>`<button type="button" class="dchip ${on(d)?'on':''}" data-d="${d}" onclick="this.classList.toggle('on');dayPickHint('${pre}')">${WDs[d]}</button>`).join('')}</div>
  <div class="dhint" id="${pre}_dh">${days&&days.length&&days.length<7?'Übung am: '+daysText(days):'Kein Tag gewählt = jeden Tag'}</div>`}
function readDays(pre){const dd=[...document.querySelectorAll('#'+pre+'_days .dchip.on')].map(b=>+b.dataset.d).sort();return dd.length&&dd.length<7?dd:null}
function dayPickHint(pre){const d=readDays(pre);$(pre+'_dh').textContent=d?'Übung am: '+daysText(d):'Kein Tag gewählt = jeden Tag';exLive()}
function initWheels(pre){document.querySelectorAll(`[id^="${pre}_w_"]`).forEach(w=>{const i=+w.dataset.i;w.scrollTop=i*40})}
function wheelTo(w,j){w.scrollTo({top:j*40,behavior:'smooth'})}
function wheelScroll(w,pre){clearTimeout(w._t);const vals=w.dataset.vals.split(',').map(Number);const j=Math.max(0,Math.min(vals.length-1,Math.round(w.scrollTop/40)));
  const items=w.querySelectorAll('div:not(.pad)');if(+w.dataset.i!==j){items[+w.dataset.i]?.classList.remove('on');items[j]?.classList.add('on');w.dataset.i=j;if(navigator.vibrate)try{navigator.vibrate(4)}catch(e){}}
  S['dp_'+pre][w.id.split('_w_')[1]]=vals[j];doseUpd(pre)}
function doseMode(pre,m,btn){S['dp_'+pre].mode=m;btn.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  $(pre+'_wrap_reps').style.display=m==='reps'?'contents':'none';$(pre+'_wrap_secs').style.display=m==='secs'?'contents':'none';
  const w=$(pre+'_w_'+m);w.scrollTop=(+w.dataset.i)*40;doseUpd(pre)}
function doseUpd(pre){const e=$(pre+'_prev');if(e)e.textContent=doseText(S['dp_'+pre]);if(pre==='ex')exLive()}
function exLive(){const box=$('exPrevBox');if(!box||!$('exT'))return;clearTimeout(exLive.t);exLive.t=setTimeout(()=>{const id=box.dataset.id;const e=(id&&S.exercises.find(x=>x.id===id))||{};
  const v=k=>($(k)?.value||'').trim();const ds=readDose('ex');
  box.innerHTML=exCard({...e,title:v('exT')||'Übung',subtitle:v('exSub'),category:v('exC'),points:[0,1,2].map(i=>v('exP'+i)).filter(Boolean),hint:v('exHint'),safety:v('exSafe'),doseSpec:ds.spec,dose:ds.text,days:readDays('ex'),mediaUrl:v('exU')||e.mediaUrl})},120)}
function readDose(pre){const s={...S['dp_'+pre],extra:($(pre+'_extra')?.value||'').trim()};const t=doseText(s)+(s.extra?' · '+s.extra:'');return {spec:s,text:t}}
function openPDose(pid,i){const p=S.patients.find(x=>x.id===pid);const a=p.assigned[i];const e=S.exercises.find(x=>x.id===a.exerciseId)||{};
  openSheet(sheetHead('Dosierung & Tage für '+esc(p.name.split(' ')[0]))+`<p class="muted" style="margin:0 0 6px">${esc(e.title||'')} · Standard: ${esc(e.dose||'–')}</p>
  ${dosePicker('pd',a.doseSpec||e.doseSpec,a.dose||e.dose,a.days||null)}
  <button class="btn full" onclick="savePDose('${pid}',${i})">Speichern</button>
  ${a.dose?`<button class="btn2" style="width:100%;margin-top:8px" onclick="savePDose('${pid}',${i},true)">Auf Standard zurücksetzen</button>`:''}`)}
async function savePDose(pid,i,reset){const p=S.patients.find(x=>x.id===pid);const arr=[...(p.assigned||[])];const d=readDose('pd');
  arr[i]=reset?{...arr[i],dose:null,doseSpec:null}:{...arr[i],dose:d.text,doseSpec:d.spec,days:readDays('pd')};

/* ---------- Medien für Upload vorbereiten (iPhone) ---------- */
const MAXB=19*1024*1024;
async function prepMedia(f,st){
  if(f.type.startsWith('image/')){if(['image/jpeg','image/png','image/webp','image/gif'].includes(f.type)&&f.size<4e6)return f;
    st.textContent='Bild wird optimiert …';const bmp=await createImageBitmap(f);const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return new File([b],f.name.replace(/\.\w+$/,'')+'.jpg',{type:'image/jpeg'})}
  if(f.type.startsWith('video/')||/\.(mov|mp4|m4v|webm)$/i.test(f.name)){
    const isWebm=f.type==='video/webm'||/\.webm$/i.test(f.name);
    if(f.size<=MAXB){st.textContent='Video wird hochgeladen …';return new File([f],f.name.replace(/\.\w+$/,'')+(isWebm?'.webm':'.mp4'),{type:isWebm?'video/webm':'video/mp4'})}
    return await transcode(f,st)}
  throw new Error('Dateityp nicht unterstützt ('+(f.type||f.name)+')')}
async function transcode(f,st){
  const step=m=>{st.dataset.step=m};
  if(!window.MediaRecorder)throw new Error('Video ist zu groß ('+Math.round(f.size/1048576)+' MB, max. 19 MB) und dein Browser kann es nicht verkleinern. Bitte kürzer aufnehmen oder als Video-Link eintragen.');
  const mime=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp8','video/webm'].find(m=>{try{return MediaRecorder.isTypeSupported(m)}catch(e){return false}});
  if(!mime)throw new Error('Verkleinern wird hier nicht unterstützt.');
  step('lesen');const url=URL.createObjectURL(f);
  st.innerHTML=`<video id="tcVid" muted playsinline webkit-playsinline preload="auto" style="width:100%;max-height:180px;border-radius:10px;background:#000;margin-top:6px"></video><span id="tcTxt">Video wird verkleinert (${Math.round(f.size/1048576)} MB) … bitte Bildschirm anlassen</span><div class="prog"><i id="tcBar"></i></div>`;
  const v=$('tcVid');v.muted=true;v.defaultMuted=true;v.src=url;
  try{
    await new Promise((res,rej)=>{const t=setTimeout(()=>rej(new Error('Video lädt nicht (Schritt: lesen)')),20000);v.onloadeddata=()=>{clearTimeout(t);res()};v.onerror=()=>{clearTimeout(t);rej(new Error('Video kann nicht gelesen werden – evtl. HEVC-Format. Tipp: iPhone Einstellungen › Kamera › Formate › „Maximale Kompatibilität“.'))}});
    const dur=v.duration;if(!isFinite(dur)||dur<=0)throw new Error('Videolänge unbekannt');if(dur>180)throw new Error('Video ist länger als 3 Minuten – bitte in der Fotos-App kürzen.');
    step('vorbereiten');const sc=Math.min(1,720/Math.max(v.videoWidth,v.videoHeight));const c=document.createElement('canvas');c.width=Math.max(2,Math.round(v.videoWidth*sc/2)*2);c.height=Math.max(2,Math.round(v.videoHeight*sc/2)*2);const ctx=c.getContext('2d');
    ctx.drawImage(v,0,0,c.width,c.height);
    if(!c.captureStream)throw new Error('Verkleinern wird hier nicht unterstützt (captureStream fehlt).');
    const stream=c.captureStream(30);
    const vbr=Math.max(400000,Math.min(2500000,Math.floor(MAXB*8*0.85/dur)));
    step('aufnehmen');const rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:vbr});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const stopped=new Promise(r=>rec.onstop=r);let run=true;
    const draw=()=>{if(!run)return;try{ctx.drawImage(v,0,0,c.width,c.height)}catch(e){}requestAnimationFrame(draw)};
    rec.start(500);
    try{await v.play()}catch(e){throw new Error('Video lässt sich nicht abspielen: '+(e.message||e.name))}
    draw();
    let last=-1,stall=0;
    await new Promise((res,rej)=>{v.onended=res;const iv=setInterval(()=>{const b=$('tcBar');if(b)b.style.width=Math.min(100,v.currentTime/dur*100)+'%';
      if(v.ended||v.currentTime>=dur-0.05){clearInterval(iv);res();return}
      if(v.currentTime===last){if(++stall>16){clearInterval(iv);rej(new Error('Verkleinern hängt – bitte App im Vordergrund und Bildschirm an lassen.'))}}else{stall=0;last=v.currentTime}},500);v.addEventListener('ended',()=>clearInterval(iv))});
    run=false;step('fertigstellen');if(rec.state!=='inactive'){rec.requestData?.();rec.stop()}await stopped;
    const type=mime.split(';')[0];const blob=new Blob(chunks,{type});
    if(!blob.size)throw new Error('Umwandlung ergab eine leere Datei.');
    if(blob.size>20*1024*1024)throw new Error('Video ist nach dem Verkleinern noch '+Math.round(blob.size/1048576)+' MB – bitte kürzen.');
    $('tcTxt')&&($('tcTxt').textContent='Verkleinert auf '+(blob.size/1048576).toFixed(1)+' MB – wird hochgeladen …');
    return new File([blob],f.name.replace(/\.\w+$/,'')+(type==='video/mp4'?'.mp4':'.webm'),{type})}
  finally{try{v.pause();v.removeAttribute('src');v.load()}catch(e){}URL.revokeObjectURL(url)}}

const DORDER=[1,2,3,4,5,6,0];

const dowOf=d=>new Date(d+'T12:00').getDay();
const addDays=(d,n)=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()+n);return ymd(x)};

function weekPlanAdmin(p,exMap){const as=p.assigned||[];
  return `<p class="muted" style="margin:0 0 4px">Wochenplan – tippe unten auf die Tage jeder Übung.</p><div class="wplan">${DORDER.map(d=>{const n=as.filter(a=>exMap[a.exerciseId]&&(!a.days||a.days.includes(d))).length;

function planFor(assigned,date){return (assigned||[]).filter(a=>onDay(a,date))}
function dayState(assigned,done,date){if(date<TRACK_FROM)return 'rest';const pl=planFor(assigned,date);if(!pl.length)return 'rest';
  const ok=pl.filter(a=>done&&done[a.exerciseId||a.id]===true).length;return ok===pl.length?'full':ok?'part':'none'}
function adherenceCard(p){const as=(p.assigned||[]).filter(a=>S.exercises.some(e=>e.id===a.exerciseId));if(!as.length)return '';
  const log=Object.fromEntries(S.exlog.filter(x=>x.patientId===p.id).map(x=>[x.date,x.done||{}]));const t=today();
  const ds=[];for(let i=13;i>=0;i--)ds.push(addDays(t,-i));
  let plan=0,did=0;const cells=ds.map(d=>{const pl=d<TRACK_FROM?[]:planFor(as,d);if(!pl.length)return 'rest';const dn=log[d]||{};const k=pl.filter(a=>dn[a.exerciseId]===true).length;
    if(d!==t||k){plan+=pl.length;did+=k}return d===t&&!k?'':k===pl.length?'full':k?'part':'none'});
  const pct=plan?Math.round(did/plan*100):null;const st=streakOf(as,log);
  return `<div class="card"><h2>Übungstreue</h2><div class="stat"><div><b>${pct==null?'–':pct+' %'}</b><span>erledigt (14 Tage)</span></div><div><b>${st}</b><span>Serie in Folge</span></div><div><b>${did}</b><span>Übungen abgehakt</span></div></div>

  <div class="legend"><span><i style="background:#1F9650"></i>alles</span><span><i style="background:#E6B13A"></i>teilweise</span><span><i style="background:var(--bad)"></i>nicht gemacht</span><span><i style="border:1px dashed var(--line-strong)"></i>Ruhetag</span></div></div>`}
function streakOf(assigned,log){const t=today();let n=0;const first=(assigned||[]).map(a=>a.assignedAt||'').filter(Boolean).sort()[0]||addDays(t,-60);
  for(let d=t,i=0;d>=first&&i<400;d=addDays(d,-1),i++){const st=dayState(assigned,log[d],d);if(st==='rest')continue;if(st==='full'){n++;continue}if(d===t)continue;break}return n}
function totalDaysOf(assigned,log){return Object.keys(log).filter(d=>d<=today()&&dayState(assigned,log[d],d)==='full').length}
const BADGES=[{k:'first',i:'🚩',t:'Erster Tag',ok:(s,t)=>t>=1},{k:'s3',i:'🔥',t:'3er-Serie',ok:s=>s>=3},{k:'d5',i:'⭐',t:'5 Trainingstage',ok:(s,t)=>t>=5},

function viewTraining(){const xs=S.meExercises;const first=esc(S.me.name.split(' ')[0]);

      `<div class="xact"><button class="yes ${v===true?'on':''}" ${dis} onclick="markEx('${sel}','${x.id}',true,this)">✓ Geschafft</button><button class="no ${v===false?'on':''}" ${dis} onclick="markEx('${sel}','${x.id}',false,this)">Nicht geschafft</button></div></article>`)}).join('')}`}
  <div class="card"><h2>Deine Abzeichen</h2><div class="badges">${BADGES.map(b=>`<div class="badge ${b.ok(streak,total)?'got':''}"><span class="bi">${b.i}</span>${b.t}</div>`).join('')}</div></div>`}
async function markEx(date,exId,val,btn){const cur={...(S.meLog[date]||{})};const before=dayState(S.meExercises,cur,date);
  const badgesBefore=BADGES.filter(b=>b.ok(streakOf(S.meExercises,S.meLog),totalDaysOf(S.meExercises,S.meLog))).map(b=>b.k);

  const after=dayState(S.meExercises,cur,date);const r=btn?btn.getBoundingClientRect():null;render();

    else if(r)burst(r.left+r.width/2,r.top+r.height/2,40)}

const FXC=['#E8505B','#F39C34','#F4D03F','#4CBF6B','#3E8EDE','#8E5BD6','#1F9650'];
const reduceMo=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
let fxParts=[],fxRun=false;
function burst(x,y,n,spread){if(reduceMo())return;const c=$('fx');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;
  for(let i=0;i<n;i++){const a=spread?Math.random()*Math.PI*2:-Math.PI/2+(Math.random()-.5)*2.2,v=(spread?4:6)+Math.random()*(spread?9:6);
    fxParts.push({x:x??Math.random()*innerWidth,y:y??-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v,g:.22+Math.random()*.1,s:5+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:FXC[i%FXC.length],l:0,sh:Math.random()<.3?'c':'r'})}

  const arcs=['#E8505B','#F39C34','#F4D03F','#4CBF6B','#3E8EDE','#8E5BD6'].map((c,i)=>{const r=96-i*10;return `<path d="M ${110-r} 108 A ${r} ${r} 0 0 1 ${110+r} 108" stroke="${c}" style="animation-delay:${i*.09}s"/>`}).join('');

function viewAppts(){
  const t=today(); const act=S.appts.filter(a=>a.status!=='abgesagt');
  const up=act.filter(a=>a.date>=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const open=act.filter(a=>a.date<t&&!a.doku).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  const pending=up.filter(a=>a.status!=='bestaetigt').length;
  let html=`<div class="card"><h2>Termine</h2><div class="stat"><div><b>${up.length}</b><span>anstehend</span></div><div><b>${pending}</b><span>zu bestätigen</span></div><div><b>${open.length}</b><span>ohne Doku</span></div></div></div>`;
  const cx=S.appts.filter(a=>a.status==='abgesagt'&&a.date>=ymd(new Date(Date.now()-14*864e5))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const cxNew=cx.filter(a=>a.cancelledBy==='patient'&&a.cancelSeen===false);
  const cxRow=a=>{const p=S.patients.find(x=>x.id===a.patientId);return `<div class="item"><div class="itop"><div><div class="iname">${esc(p?.name||a.name)}</div><div class="imeta">${WDs[new Date(a.date+'T12:00').getDay()]} ${fmt(a.date)} · ${esc(a.time)} Uhr · abgesagt von ${a.cancelledBy==='praxis'?'dir':'Patient'}${a.cancelReason?' · „'+esc(a.cancelReason)+'“':''}</div></div>
    <span class="pill p-abgesagt">${a.lateCancel?'Gebühr '+eur(feeOf(a)):'kostenfrei'}</span></div>${sentLine(a.cancelNotified,'Absage mitgeteilt')}
    ${a.cancelledBy==='patient'&&a.cancelSeen===false?`<div class="acts"><button class="btn2" onclick="markCancelSeen('${a.id}')">Gesehen</button><button class="btn2" onclick="openCancelMsg('${a.id}','${a.lateCancel?'late':'free'}','');markCancelSeen('${a.id}')">Antworten</button></div>`:''}</div>`};
  if(cxNew.length) html+=`<div class="card" style="border-color:var(--bad)"><h2>Neue Absagen von Patienten</h2>${cxNew.map(cxRow).join('')}</div>`;
  const req=up.filter(a=>a.status==='angefragt');
  if(req.length) html+=`<div class="card" style="border-color:var(--amber)"><h2>Neue Anfragen</h2><p class="muted" style="margin:-4px 0 8px">Bestätigen öffnet direkt die Nachricht mit Termin und Zugangscode.</p>${req.map(a=>`<div class="dayhead">${WD[new Date(a.date+'T12:00').getDay()]}, ${fmt(a.date)}</div>`+apptCard(a)).join('')}</div>`;
  if(open.length) html+=`<div class="card"><h2>Noch zu dokumentieren</h2>${open.map(a=>`<div class="dayhead">${WD[new Date(a.date+'T12:00').getDay()]}, ${fmt(a.date)}</div>`+apptCard(a)).join('')}</div>`;
  let last='';html+=`<div class="card"><h2>Anstehend</h2>${up.length?up.map(a=>{const h=a.date!==last?`<div class="dayhead">${WD[new Date(a.date+'T12:00').getDay()]}, ${fmt(a.date)}</div>`:'';last=a.date;return h+apptCard(a)}).join(''):'<div class="empty">Keine anstehenden Termine.</div>'}</div>`;
  const cxOld=cx.filter(a=>!cxNew.includes(a));
  if(cxOld.length) html+=`<details class="sec"><summary>Abgesagte Termine (${cxOld.length})</summary><div class="in">${cxOld.map(cxRow).join('')}</div></details>`;
  return html;
}

      ${d&&(d.trend||d.vas!=null)?`<div style="margin:4px 0">${d.trend?`<span class="trend t-${d.trend}">${d.trend==='besser'?'▲ besser':d.trend==='schlechter'?'▼ schlechter':'= gleich'}</span> `:''}${d.vas!=null?`<span class="muted" style="font-size:.84rem">Schmerz ${d.vas}/10</span>`:''}</div>`:''}
      ${d?`${d.massnahmen?`<div class="k">Durchgeführt</div><p>${esc(d.massnahmen)}</p>`:''}${d.befundHeute?`<div class="k">Befund / Beobachtung</div><p>${esc(d.befundHeute)}</p>`:''}
        ${(d.uebungen||[]).length?`<div class="k">Übungen mitgegeben</div><p>${d.uebungen.map(x=>esc(exMap[x]?.title||'Übung')).join(', ')}</p>`:''}
        ${d.hausaufgabe?`<div class="k">Hausaufgabe</div><p>${esc(d.hausaufgabe)}</p>`:''}${d.wiedersehen?`<div class="k">Wiedersehen</div><p>${esc(d.wiedersehen)}</p>`:''}`
        :(!fut?`<p class="muted">Noch nicht dokumentiert.</p>`:'')}
      ${a.status!=='abgesagt'?`<button class="lnk" style="margin-top:6px" onclick="openDoku('${a.id}')">${d?'Doku bearbeiten':'Dokumentieren'}</button>${fut?` · <button class="lnk" style="color:var(--bad)" onclick="openCancel('${a.id}')">Absagen</button>`:''}`:''}</div>`}).join('')}</div>`:'<div class="empty">Noch keine Termine.</div>'}</div>
  <div class="card"><div class="itop"><h2>Rechnungen</h2><button class="btn2" onclick="openInvoice('${id}')">+ Rechnung</button></div>
    <p class="muted" style="margin:0 0 8px">${unbilled(id).length} behandelte Termine noch nicht abgerechnet.</p>
    ${S.invoices.filter(i=>i.patientId===id).map(invCard).join('')||'<div class="empty">Noch keine Rechnungen.</div>'}</div>
  <button class="btn2 danger" onclick="deletePatient('${id}')">Patient löschen</button>`;
}

async function assignExercises(pid,ids,note,days){const p=S.patients.find(x=>x.id===pid);const a=[...(p.assigned||[])];const have=new Set(a.map(x=>x.exerciseId));

function openNewAppt(pid){const d=today();openSheet(sheetHead('Termin eintragen')+`

function openDoku(aid){const a=S.appts.find(x=>x.id===aid);if(!a)return;const d=a.doku||{};const p=S.patients.find(x=>x.id===a.patientId);

async function saveDoku(aid){const a=S.appts.find(x=>x.id===aid);const ids=[...document.querySelectorAll('input[name=du]:checked')].map(i=>i.value);

/* exercises */
const CAT_ORDER=['Hüfte','Knie','Sprunggelenk','Fuß/Sprunggelenk','Rumpf','Rücken','HWS','Schulter'];
const catSort=(a,b)=>a==='Ohne Kategorie'?1:b==='Ohne Kategorie'?-1:((CAT_ORDER.indexOf(a)+1)||99)-((CAT_ORDER.indexOf(b)+1)||99)||a.localeCompare(b,'de');
const CHEV='<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>';
S.exOpen=S.exOpen||new Set();
function catGroup(key,name,count,inner,open,small){return `<details class="xcatg${small?' sm':''}" ${open?'open':''} ontoggle="this.open?S.exOpen.add('${key}'):S.exOpen.delete('${key}')"><summary><span class="cn">${esc(name)}</span><span class="cc">${count} ${count===1?'Übung':'Übungen'}</span><span class="cv">${CHEV}</span></summary><div class="xin">${inner}</div></details>`}
function viewExercises(){const q=S.exSearch.toLowerCase();const list=S.exercises.filter(e=>!q||(e.title+' '+(e.subtitle||'')+' '+(e.category||'')).toLowerCase().includes(q));
  const groups={};list.forEach(e=>{const c=e.category||'Ohne Kategorie';(groups[c]=groups[c]||[]).push(e)});
  const order=Object.keys(groups).sort(catSort);
  const th=e=>{const u=mediaUrl(e);return u?(isVideo(e)?`<video src="${esc(u)}#t=0.1" muted playsinline preload="metadata"></video>`:`<img src="${esc(u)}" alt="" loading="lazy">`):'kein Bild'};
  return `<div class="card"><div class="itop"><h2>Übungsbibliothek (${S.exercises.length})</h2><button class="btn2" onclick="openExercise()">+ Übung</button></div>
  <input id="exSearch" placeholder="Suchen nach Name oder Körperregion" value="${esc(S.exSearch)}" oninput="S.exSearch=this.value;render()" style="margin:4px 0 4px">
  <p class="muted" style="margin:6px 0 0">Bereich antippen, um die Übungen zu öffnen.</p>
  ${list.length?order.map(c=>catGroup('lib_'+c,c,groups[c].length,groups[c].sort((a,b)=>a.title.localeCompare(b.title,'de')).map(e=>`<div class="xrow" onclick="openExercise('${e.id}')"><div class="th">${th(e)}</div>
    <div><div class="t">${esc(e.title)}</div><div class="s">${e.subtitle?esc(e.subtitle)+' · ':''}${e.assetId?(isVideo(e)?'🎬 Video':'🖼 Foto'):e.mediaUrl?'🔗 Link':'ohne Medien'}${exParts(e).pts.length?' · '+exParts(e).pts.length+' Punkte':''}</div>${e.dose?`<span class="dose">${esc(cleanDose(e.dose))}</span>`:''}</div><span class="chev">›</span></div>`).join(''),!!q||S.exOpen.has('lib_'+c))).join('')
    :'<div class="empty">Lege deine erste Übung an, zum Beispiel Bridging, Einbeinstand oder Kniebeuge.</div>'}</div>`}
function openExercise(id){const e=id?S.exercises.find(x=>x.id===id):{};
  openSheet(sheetHead(id?'Übung bearbeiten':'Neue Übung')+`
  <label for="exT">Name</label><input id="exT" value="${esc(e.title||'')}" placeholder="z. B. Bridging">
  <label for="exSub">Zweitname / englisch (optional)</label><input id="exSub" value="${esc(e.subtitle||'')}" placeholder="z. B. Glute Bridge">
  <div class="row2"><div><label for="exC">Körperregion</label><input id="exC" list="cats" value="${esc(e.category||'')}" placeholder="z. B. Hüfte"><datalist id="cats">${['Rücken','HWS','Schulter','Hüfte','Knie','Fuß/Sprunggelenk','Rumpf','Gleichgewicht','Mobilisation','Kraft','Dehnung'].map(c=>`<option>${c}</option>`).join('')}</datalist></div>
  <div></div></div>
  <label>Dosierung</label>${dosePicker('ex',e.doseSpec,e.dose,e.days||null)}<div class="dhint">Wochentage sind der Standard beim Zuweisen – pro Patient änderbar.</div>
  ${(()=>{const P=exParts(e);const ph=['Ausgangsstellung, z. B. Rückenlage, Füße hüftbreit aufgestellt','Bewegung, z. B. Becken langsam anheben bis Körperlinie','Worauf achten, z. B. kein Hohlkreuz, Knie zeigen nach vorne'];
    return `<h3 style="margin:18px 0 4px">Darauf kommt es an</h3><p class="muted" style="margin:0 0 6px">Drei kurze, klare Sätze – so sieht es der Patient.</p>${[0,1,2].map(i=>`<label for="exP${i}" style="display:flex;align-items:center;gap:8px"><span style="width:24px;height:24px;border-radius:50%;background:#1F9650;color:#fff;display:inline-grid;place-items:center;font-size:.8rem;font-weight:700">${i+1}</span> Punkt ${i+1}</label><textarea id="exP${i}" style="min-height:56px" placeholder="${ph[i]}">${esc(P.pts[i]||'')}</textarea>`).join('')}
    <label for="exHint">Zusätzlicher Hinweis (optional)</label><input id="exHint" value="${esc(P.hint||'')}" placeholder="z. B. Erweiterung: Bein anheben">
    <label for="exSafe">Sicherheitshinweis</label><input id="exSafe" value="${esc(P.safe)}">`})()}
  ${S.assets?`<label for="exF">Foto oder Video hochladen</label><input id="exF" type="file" accept="image/*,video/*,.mov,.mp4"><p class="muted" style="margin:4px 0 0;font-size:.8rem">iPhone-Videos bis 3 Min. werden automatisch verkleinert. Das dauert so lange wie das Video selbst.</p>${e.assetId?`<div style="margin-top:8px">${mediaEl(e,'width:100%;max-height:220px;border-radius:10px;background:#000')}</div><button type="button" class="lnk" style="color:var(--bad)" onclick="removeMedia('${id}')">${isVideo(e)?'Video':'Foto'} entfernen</button>`:''}
  <p class="muted" id="exFs" style="margin:4px 0 0">${e.assetId?'✓ Gespeichert. Neue Auswahl ersetzt die Datei.':''}</p>`:''}
  <label for="exU">oder Video-Link (optional)</label><input id="exU" value="${esc(e.mediaUrl||'')}" placeholder="https://…">
  <button class="btn full" id="exSave" onclick="saveExercise(${id?`'${id}'`:'null'})">Übung speichern</button>
  <div class="xprev"><p class="muted" style="margin:0 0 8px;text-align:center">So sieht der Patient die Übung</p><div id="exPrevBox" data-id="${id||''}">${exCard(e)}</div></div>
  ${id?`<button class="btn2 danger" style="width:100%;margin-top:8px" onclick="deleteExercise('${id}')">Übung löschen</button>`:''}`)}
async function saveExercise(id){const title=$('exT').value.trim();if(!title){toast('Bitte einen Namen angeben');return}
  const btn=$('exSave');btn.disabled=true;const pts=[0,1,2].map(i=>$('exP'+i).value.trim()).filter(Boolean);const ds=readDose('ex');const data={days:readDays('ex'),title,category:$('exC').value.trim(),dose:ds.text,doseSpec:ds.spec,subtitle:$('exSub').value.trim(),points:pts,hint:$('exHint').value.trim(),safety:$('exSafe').value.trim(),description:pts.map((t,i)=>(i+1)+'. '+t).join('\n')+($('exHint').value.trim()?'\n'+$('exHint').value.trim():'')+($('exSafe').value.trim()?'\n\n'+$('exSafe').value.trim():''),mediaUrl:$('exU').value.trim(),updatedAt:Date.now()};
  const f=$('exF')?.files?.[0];let mediaErr='';
  if(f){try{const up=await prepMedia(f,$('exFs'));if($('tcTxt'))$('tcTxt').textContent='Wird hochgeladen …';else $('exFs').textContent='Wird hochgeladen …';
      let r;try{r=await S.assets.upload(up)}catch(err){if(err&&err.code==='store_unavailable'){await new Promise(z=>setTimeout(z,1500));r=await S.assets.upload(up)}else throw err}
      data.assetId=r.id;data.mediaType=r.contentType||up.type}
    catch(e){mediaErr=e&&e.code==='quota_or_state'?'Speicherplatz der App ist voll oder gerade nicht verfügbar.':e&&e.code==='too_large'?'Datei ist größer als 20 MB.':e&&e.code==='unsupported_type'?'Dateiformat wird nicht angenommen.':e&&e.code?'Hochladen abgelehnt ('+e.code+(e.message?': '+e.message:'')+')':(e&&e.message)||'Unbekannter Fehler'}}
  try{if(id)await S.db.doc('exercises/'+id).update(data);else{const ref=S.db.collection('exercises').doc();await ref.set({...data,createdAt:Date.now()});id=ref.id}}
  catch(e){btn.disabled=false;toast('Speichern fehlgeschlagen');return}
  if(mediaErr){btn.disabled=false;btn.setAttribute('onclick',`saveExercise('${id}')`);$('exFs').innerHTML=`<span style="color:var(--bad)"><b>Übung gespeichert, aber das Video nicht:</b><br>${esc(mediaErr)}</span>`;toast('Video nicht gespeichert');return}
  closeSheet();toast(f?'Übung mit Video gespeichert ✓':'Übung gespeichert')}
async function removeMedia(id){if(!confirm('Datei von der Übung entfernen?'))return;const e=S.exercises.find(x=>x.id===id);
  try{await S.db.doc('exercises/'+id).update({assetId:null,mediaType:null});try{e?.assetId&&S.assets&&await S.assets.delete(e.assetId)}catch(_){}closeSheet();toast('Datei entfernt')}catch(err){toast('Entfernen fehlgeschlagen')}}
async function deleteExercise(id){if(!confirm('Übung löschen? Sie verschwindet auch bei Patienten, denen sie zugewiesen ist.'))return;await S.db.doc('exercises/'+id).delete();closeSheet();toast('Übung gelöscht')}

/* invoices */
const lineOf=a=>{const d=a.doku?.dauer||a.duration||60;return a.lateCancel?{leistung:`Ausfallgebühr ${S.settings.cancelFee} % (${a.type})`,dauer:null,preis:Math.round(priceOf(a.type,d)*(+S.settings.cancelFee||50))/100}:{leistung:a.type,dauer:d,preis:priceOf(a.type,d)}};
const unbilled=pid=>S.appts.filter(a=>a.patientId===pid&&!a.invoiceId&&((a.status==='abgesagt'&&a.lateCancel)||(a.status!=='abgesagt'&&(a.doku||a.date<today())))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
function invCard(i){const overdue=i.status!=='bezahlt'&&i.faellig&&i.faellig<today();
  return `<div class="item"><div class="itop"><div><div class="iname">Nr. ${esc(i.number)} · ${eur(i.total)}</div><div class="imeta">${esc(i.patientName)} · ${fmt(i.date)} · ${i.items.length} Position${i.items.length===1?'':'en'}</div></div>
  <span class="pill ${i.status==='bezahlt'?'p-bestaetigt':overdue?'p-abgesagt':'p-angefragt'}">${i.status==='bezahlt'?'bezahlt':overdue?'überfällig':'offen'}</span></div>
  <div class="acts"><button class="btn2" onclick="invoicePdf('${i.id}')">PDF</button>${i.status!=='bezahlt'?`<button class="btn2" onclick="markPaid('${i.id}',true)">Als bezahlt markieren</button>`:`<button class="btn2" onclick="markPaid('${i.id}',false)">Wieder offen</button>`}
  <button class="btn2 danger" onclick="deleteInvoice('${i.id}')">Stornieren</button></div></div>`}
function viewInvoices(){const y=String(new Date().getFullYear());
  const open=S.invoices.filter(i=>i.status!=='bezahlt'),paid=S.invoices.filter(i=>i.status==='bezahlt'&&(i.date||'').startsWith(y));
  const todo=S.patients.map(p=>({p,n:unbilled(p.id).length})).filter(x=>x.n);
  return `<div class="card"><div class="itop"><h2>Rechnungen</h2><button class="btn2" onclick="openInvoice()">+ Rechnung</button></div>
  <div class="stat"><div><b>${eur(open.reduce((s,i)=>s+i.total,0))}</b><span>offen (${open.length})</span></div><div><b>${eur(paid.reduce((s,i)=>s+i.total,0))}</b><span>bezahlt ${y}</span></div></div>
  ${S.settings.praxis.iban?'':'<p class="muted">Tipp: Trage unter „Einstellungen“ deine Praxisdaten und IBAN ein, damit sie auf der Rechnung stehen.</p>'}</div>

function openInvoice(pid){
  if(!pid){openSheet(sheetHead('Rechnung für …')+(S.patients.map(p=>`<div class="item click" onclick="openInvoice('${p.id}')"><div class="iname">${esc(p.name)}</div><div class="imeta">${unbilled(p.id).length} offen</div></div>`).join('')||'<div class="empty">Noch keine Patienten.</div>'));return}

  <h3>Freie Position (optional)</h3><div class="row2" style="grid-template-columns:1fr 110px"><input id="ivFree" placeholder="z. B. Befundbericht"><input id="ivFreeP" type="number" step="0.01" placeholder="€"></div>

async function createInvoice(pid){const p=S.patients.find(x=>x.id===pid);

  const items=ids.map(id=>{const a=S.appts.find(x=>x.id===id);return {apptId:id,date:a.date,...lineOf(a)}});

  try{const cur=await S.db.doc('settings/praxis').get();const counter=((cur.exists&&cur.data().invoiceCounter)||0)+1;await saveSettings({invoiceCounter:counter});
    const y=$('ivDate').value.slice(0,4);const number=`${y}-${String(counter).padStart(3,'0')}`;const dz=new Date($('ivDate').value+'T12:00');dz.setDate(dz.getDate()+(+S.settings.praxis.ziel||14));

    for(const id of ids) await S.db.doc('appointments/'+id).update({invoiceId:ref.id});
    closeSheet();toast('Rechnung '+number+' erstellt');invoicePdf(ref.id,{number,patientName:p.name,anschrift:p.anschrift||'',date:$('ivDate')?.value||today(),faellig:ymd(dz),verordnung:$('ivVer').value.trim(),items,total:items.reduce((s,i)=>s+i.preis,0)});

async function invoicePdf(id,fallback){
