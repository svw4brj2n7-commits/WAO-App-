  if(!window.jspdf){toast('PDF-Erstellung nicht verfügbar');return}
  if(!S.dl){toast('Download in dieser Ansicht nicht verfügbar');return}
  const P=S.settings.praxis;const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:'mm',format:'a4'});
  const e=n=>(Math.round(n*100)/100).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' EUR';
  let y=20;doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text(P.name||'Physiotherapie',20,y);
  doc.setFont('helvetica','normal');doc.setFontSize(9);y+=5;[...(P.anschrift||'').split('\n'),P.kontakt].filter(Boolean).forEach(l=>{doc.text(l,20,y);y+=4});
  y=52;doc.setFontSize(7);doc.setTextColor(120);doc.text([P.name,...(P.anschrift||'').split('\n')].filter(Boolean).join(' · '),20,y);doc.setTextColor(0);
  doc.setFontSize(10);y+=6;[i.patientName,...(i.anschrift||'').split('\n')].filter(Boolean).forEach(l=>{doc.text(l,20,y);y+=5});
  doc.setFontSize(9);let ry=58;[['Rechnungsnr.',i.number],['Datum',fmt(i.date)],['Fällig bis',fmt(i.faellig)]].forEach(([k,v])=>{doc.text(k,140,ry);doc.text(String(v),190,ry,{align:'right'});ry+=5});
  y=Math.max(y,ry)+14;doc.setFont('helvetica','bold');doc.setFontSize(15);doc.text('Rechnung',20,y);y+=7;
  doc.setFont('helvetica','normal');doc.setFontSize(10);
  if(i.verordnung){doc.splitTextToSize('Verordnung: '+i.verordnung,170).forEach(l=>{doc.text(l,20,y);y+=5});y+=1}
  doc.text('Für die physiotherapeutische Behandlung berechne ich:',20,y);y+=9;
  doc.setFont('helvetica','bold');doc.setFontSize(9);doc.text('Datum',20,y);doc.text('Leistung',45,y);doc.text('Dauer',140,y);doc.text('Betrag',190,y,{align:'right'});
  y+=2;doc.setDrawColor(180);doc.line(20,y,190,y);y+=6;doc.setFont('helvetica','normal');
  i.items.forEach(it=>{if(y>260){doc.addPage();y=20}doc.text(fmt(it.date),20,y);doc.text(doc.splitTextToSize(it.leistung,90),45,y);doc.text(it.dauer?it.dauer+' Min':'',140,y);doc.text(e(it.preis),190,y,{align:'right'});y+=7});
  y-=2;doc.line(120,y,190,y);y+=6;doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Gesamtbetrag',120,y);doc.text(e(i.total),190,y,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9);y+=12;
  if(P.hinweis){doc.splitTextToSize(P.hinweis,170).forEach(l=>{doc.text(l,20,y);y+=4.5});y+=3}
  const pay=`Bitte überweisen Sie den Betrag bis zum ${fmt(i.faellig)} unter Angabe der Rechnungsnummer ${i.number}`+(P.iban?` auf das Konto IBAN ${P.iban}${P.bank?' ('+P.bank+')':''}.`:'.');
  doc.splitTextToSize(pay,170).forEach(l=>{doc.text(l,20,y);y+=4.5});y+=8;doc.text('Vielen Dank und freundliche Grüße',20,y);
  doc.setFontSize(7.5);doc.setTextColor(120);doc.text([P.name,P.steuernr?'Steuernummer '+P.steuernr:'',P.iban?'IBAN '+P.iban:''].filter(Boolean).join('  ·  '),105,287,{align:'center'});
  const blob=doc.output('blob');
  try{await S.dl.save({filename:`Rechnung_${i.number}_${(i.patientName||'').replace(/[^A-Za-z0-9ÄÖÜäöüß]+/g,'_')}.pdf`,data:blob})}catch(err){if(err?.code!=='declined')toast('PDF konnte nicht gespeichert werden')}}

<script>
/* ---------- Befund-Diktat ---------- */
const DK={
  joints:[[/^(hws|halswirbelsäule|halswirbelsaeule|nacken)$/,'hws'],[/^(bws|lws|rumpf|wirbelsäule|lendenwirbelsäule|brustwirbelsäule)$/,'rumpf'],
    [/^(schulter|schultergelenk|sg)$/,'schulter'],[/^(ellenbogen|ellbogen|ellenbogengelenk)$/,'ellenbogen'],[/^(hand|handgelenk|hg-hand)$/,'hand'],
    [/^(hüfte|hüftgelenk|hüft|hg|hüften)$/,'huefte'],[/^(knie|kniegelenk|kg)$/,'knie'],[/^(sprunggelenk|osg|usg|fuß|fuss|sprunggelenks)$/,'fuss']],
  prefixes:[['hüft','huefte'],['knie','knie'],['schulter','schulter'],['sprunggelenk','fuss'],['ellenbogen','ellenbogen'],['hand','hand']],
  moves:[[/^(flexion|flex|beugung|anteversion)$/,'flex'],[/^(extension|ext|streckung|retroversion)$/,'ext'],[/^(abduktion|abd|abspreizen)$/,'abd'],
    [/^(adduktion|add|heranführen)$/,'add'],[/^(innenrotation|ir|innen)$/,'ir'],[/^(außenrotation|aussenrotation|ar|außen|aussen)$/,'ar'],
    [/^(rotation|rot|drehung)$/,'rot'],[/^(lateralflexion|lat|seitneigung|seitneige)$/,'lat'],[/^(pronation|pro)$/,'pro'],[/^(supination|sup)$/,'sup'],
    [/^(dorsalextension|dorsalflexion|dorsal|de|dext)$/,'dext'],[/^(palmarflexion|palmar)$/,'pflex'],[/^(plantarflexion|plantar|pf)$/,'pflex'],
    [/^(radialabduktion|radial|ra)$/,'rabd'],[/^(ulnarabduktion|ulnar|ua)$/,'uabd'],[/^(eversion|ev)$/,'ev'],[/^(inversion|inv)$/,'inv']],
  words:{null:0,eins:1,ein:1,eine:1,zwei:2,drei:3,vier:4,fünf:5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,fünfzehn:15,zwanzig:20,dreißig:30,dreissig:30,vierzig:40,fünfzig:50,sechzig:60,siebzig:70,achtzig:80,neunzig:90,hundert:100},
  monate:{januar:1,jan:1,februar:2,feb:2,märz:3,maerz:3,april:4,mai:5,juni:6,juli:7,august:8,september:9,oktober:10,november:11,dezember:12}
};
function dkParse(raw){
  const out={entries:[],name:null,geb:null,hints:[]};
  let text=' '+raw.replace(/\u00a0/g,' ')+' ';
  // Geburtsdatum
  const toISO=(d,m,y)=>{y=+y;if(y<100)y+=y>30?1900:2000;if(!(d>=1&&d<=31&&m>=1&&m<=12&&y>1900))return null;return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`};
  const reGeb=/(?:geboren(?:\s+am)?|geburtsdatum|geb\.?)\s*:?\s*(\d{1,2})\.?\s*(?:(\d{1,2})\.?|([a-zäA-ZÄ]+))\s*(\d{2,4})/i;
  let g=text.match(reGeb);
  if(g){ const m=g[2]?+g[2]:DK.monate[(g[3]||'').toLowerCase()]; out.geb=toISO(+g[1],m,g[4]); if(!out.geb) out.hints.push('Geburtsdatum nicht eindeutig erkannt'); text=text.replace(g[0],' '); }
  // Name
  const reName=/(?:neue[rn]?\s+)?(?:patientin|patient|name)\s*:?\s+([A-Za-zÄÖÜäöüß][\wÄÖÜäöüß.\-']*(?:\s+[A-Za-zÄÖÜäöüß][\wÄÖÜäöüß.\-']*){0,3})/i;
  const n=text.match(reName);
  if(n){ const stop=/^(geboren|geburtsdatum|geb|mft|rom|aktiv|passiv|rechts|links|kraft|kraftgrad)$/i;
    const ws=[]; for(const w of n[1].split(/\s+/)){ if(stop.test(w)||DK.joints.some(([r])=>r.test(w.toLowerCase()))) break; ws.push(w); }
    if(ws.length){ out.name=ws.map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' '); text=text.replace(n[0].slice(0,n[0].indexOf(n[1]))+ws.join(' '),' '); } }
  // Befundwerte
  let t=text.toLowerCase().replace(/°|\^|grad\b/g,' grad ').replace(/[,;:!?()]/g,' ').replace(/(\d)\s*(minus)\b/g,'$1-').replace(/(\d)\s*(plus)\b/g,'$1+')
    .replace(/(\d)\s+-(?=\s|$)/g,'$1-').replace(/(\d)\s+\+(?=\s|$)/g,'$1+').replace(/\.(?=\s|$)/g,' ');
  const tok=t.split(/\s+/).filter(Boolean);
  const jointOf=w=>{for(const [r,id] of DK.joints) if(r.test(w)) return id; return null};
  const moveOf=w=>{for(const [r,id] of DK.moves) if(r.test(w)) return id; return null};
  const sideOf=w=>/^(rechts|rechte[rnms]?|re|r)$/.test(w)?'re':/^(links|linke[rnms]?|li|l)$/.test(w)?'li':null;
  // Werte dürfen vor oder nach Gelenk/Seite/Bewegung stehen: "IR 40" und "40 IR" sind beides möglich
  const ctx={gid:null,side:null,mov:null,art:'romAP',field:'aktiv'};
  const pre=new Set(), style=new Set(); let cur=null, last=null;
  const finalize=()=>{ if(!cur) return; const it=cur; cur=null; const sl=it.slots;
    const G=GELENKE.find(x=>x.id===sl.gid); const val=it.num+it.mod;
    if(!G||!sl.mov){ out.hints.push(`Wert ${val} ohne ${!G?'Gelenk':'Bewegung'}${G?' ('+G.name+')':''}`); return; }
    let mid=sl.mov, s=G.seitig?sl.side:'m';
    if(mid==='rot'||mid==='lat'){ if(G.seitig||!sl.side){ out.hints.push(`${G.name} ${mid==='rot'?'Rotation':'Lateralflexion'} ${val}: Richtung rechts oder links fehlt`); return; } mid+=sl.side; }
    const B=G.bew.find(x=>x.id===mid);
    if(!B){ out.hints.push(`${G.name}: Bewegung passt nicht zum Gelenk (Wert ${val})`); return; }
    if(!s){ out.hints.push(`${G.name} ${B.name} ${val}: Seite fehlt`); return; }
    const base={art:sl.art,gid:G.id,s,mid};
    if(sl.art==='mft'){ if(!KRAFT.includes(val)){ out.hints.push(`Kraftgrad ${val} ungültig (${G.name} ${B.name})`); return; } out.entries.push({...base,field:'grad',value:val}); }
    else out.entries.push({...base,field:sl.field,value:it.num});
    last=base; if(it.eg) addEg(it.eg); };
  const addEg=v=>{ if(last&&last.art==='romAP') out.entries.push({...last,field:'endgefuehl',value:v}); else out.hints.push('Endgefühl „'+v+'“ ohne Bewegung'); };
  const attr=(k,v)=>{
    if(cur&&cur.adj&&k!=='gid'&&k!=='field'){
      let ok=false;
      if(k==='art') ok=v==='mft'&&!cur.ex.has('art')&&+cur.num<=5&&!/^-?\d/.test(nextTok());
      else if(!cur.ex.has(k)){ if(cur.slots[k]==null){ ok=true; style.add(k); } else ok=style.has(k); }
      if(ok){ cur.slots[k]=v; cur.ex.add(k); ctx[k]=v; return; }
    }
    if(cur) cur.adj=false;
    ctx[k]=v; pre.add(k);
    if(k==='gid') ctx.mov=null;
    if(k==='field') ctx.art='romAP';
  };
  let ti=0; const nextTok=()=>tok[ti+1]||'';
  for(let i=0;i<tok.length;i++){ ti=i; const w=tok[i];
    if(/^(gelenk|wert|werte|bei|mit|und|der|die|das|grad)$/.test(w)) continue;
    if(/^(mft|muskelfunktionstest|kraft|kraftgrad|kraftwert)$/.test(w)){ attr('art','mft'); continue; }
    if(/^(rom|beweglichkeit|bewegungsausmaß|neutral-null|nullmethode)$/.test(w)){ attr('art','romAP'); continue; }
    if(w==='aktiv'||w==='passiv'){ attr('field',w); continue; }
    const ej=['weich','fest','hart','leer','spastisch','federnd'].find(x=>w.startsWith(x));
    if(ej&&(/elastisch/.test(w)||tok[i+1]==='elastisch'||['leer','spastisch','federnd'].includes(ej)||(ej==='hart'&&tok[i+1]==='vorzeitig'))){
      const val=['leer','spastisch','federnd'].includes(ej)?ej:(/elastisch/.test(w)||tok[i+1]==='elastisch')?ej+'-elastisch':'hart (vorzeitig)';
      if(tok[i+1]==='elastisch'||tok[i+1]==='vorzeitig') i++;
      if(cur){ cur.eg=val; cur.adj=false; } else addEg(val); continue; }
    if(w==='endgefühl'||w==='endgefuehl') continue;
    let j=jointOf(w);
    if(!j){ for(const [p,id] of DK.prefixes) if(w.startsWith(p)&&w.length>p.length){ const rest=w.slice(p.length).replace(/^-/,''); if(moveOf(rest)){ j=id; tok.splice(i+1,0,rest); break; } } }
    if(j){ attr('gid',j); continue; }
    const sd=sideOf(w); if(sd){ attr('side',sd); continue; }
    const mv=moveOf(w); if(mv){ attr('mov',mv); continue; }
    let num=null, mod=''; const m=w.match(/^(-?\d{1,3})([+-]?)$/);
    if(m){ num=+m[1]; mod=m[2]; } else if(w in DK.words) num=DK.words[w];
    if(num===null){ if(cur) cur.adj=false; continue; }
    if(tok[i+1]==='+'||tok[i+1]==='-'){ mod=tok[i+1]; i++; }
    if(tok[i+1]==='von'&&/^(5|fünf)$/.test(tok[i+2]||'')) i+=2;
    finalize();
    if(ctx.art==='mft'&&!mod&&num>5) ctx.art='romAP';
    cur={num,mod,slots:{...ctx},ex:new Set(pre),adj:true}; pre.clear();
  }
  finalize();
  // Doppelte: letzter Wert zählt
  const map=new Map(); out.entries.forEach(e=>map.set([e.art,e.gid,e.s,e.mid,e.field].join('|'),e)); out.entries=[...map.values()];
  return out;
}
function dkLabel(e){ const G=GELENKE.find(x=>x.id===e.gid), B=G.bew.find(b=>b.id===e.mid);
  const side=e.s==='re'?' rechts':e.s==='li'?' links':'';
  const val=e.field==='grad'?'Kraftgrad '+e.value:e.field==='endgefuehl'?'Endgefühl '+e.value:(e.field==='aktiv'?'aktiv ':'passiv ')+e.value+'°';
  return {ort:(e.art==='mft'?'MFT ':'')+G.name+side, bew:B.name, val}; }
function openDictate(pid){ S.dk={pid,res:null,skip:new Set()};
  openSheet(sheetHead('Befund diktieren')+`
  <p class="muted" style="margin:0 0 8px">Ins Feld tippen, dann auf das Mikrofon der iPhone-Tastatur. Du kannst mehrere Werte am Stück sprechen und vor dem Übernehmen alles prüfen.</p>
  <textarea id="dk_t" style="min-height:130px" placeholder="z. B. Hüfte rechts Innenrotation 40 Grad, passiv 45, fest-elastisch. Links Innenrotation 30. MFT Hüfte rechts Abduktion 4 minus." oninput="dkPrev()"></textarea>

    <p>Reihenfolge ist frei: „Schulter links Flexion 120“ oder „Schulter links 120 Grad Flex, 90 Abd, 20 IR“. Gelenk, Seite und Bewegung gelten weiter, bis du etwas Neues sagst, z. B. „Schulter Flex passiv 30 Grad links, 20 Grad rechts“.</p><p>„Passiv“ gilt für alle folgenden Werte, bis du „aktiv“ sagst.</p>

  <div id="dk_prev"></div>

}

  d.res=dkParse($('dk_t').value); d.skip=new Set(); const r=d.res, p=S.patients.find(x=>x.id===d.pid)||{};

  const cur=e=>{const v=bGet(b,e.art,e.gid,e.s,e.mid);if(!v)return'';const x=e.field==='grad'?v.grad:v[e.field];return istZ(x)&&x!==''?(e.field==='grad'||e.field==='endgefuehl'?x:x+'°'):''};
  let h='';
  if(r.name||r.geb) h+=`<h3>Stammdaten</h3>${r.name?`<label class="dk-row"><input type="checkbox" checked onchange="dkSkip('name',this.checked)"><span><b>Name</b> ${esc(r.name)}${p.name&&p.name!=='Neuer Patient'&&p.name!==r.name?`<small>bisher ${esc(p.name)}</small>`:''}</span></label>`:''}

  if(r.hints.length) h+=`<div class="dk-hint">${r.hints.map(x=>'• '+esc(x)).join('<br>')}<br><span>Diese Angaben werden nicht übernommen. Ergänze sie im Text oder trage sie von Hand ein.</span></div>`;
  if(!h&&$('dk_t').value.trim()) h='<p class="muted">Noch nichts erkannt. Nenne Gelenk, Seite, Bewegung und Wert.</p>';
  $('dk_prev').innerHTML=h; $('dk_ok').disabled=!(r.entries.length||r.name||r.geb);

 },250); }
function dkSkip(k,on){ if(on) S.dk.skip.delete(k); else S.dk.skip.add(k); }
async function dkApply(){ const d=S.dk; if(!d||!d.res) return; const r=d.res, p=S.patients.find(x=>x.id===d.pid); if(!p) return;

  const b=bInit(p); let n=0, lastArt=null;

    const old=b[e.art][e.gid][e.s][e.mid];

    else b[e.art][e.gid][e.s][e.mid]={notiz:'',...(old||{}),grad:e.value};

<script>
/* ---------- Bewegungsanalyse (3D-Skelettmodell) ---------- */
window.BWA=(function(){
const V=(x,y,z)=>new THREE.Vector3(x,y,z), D=Math.PI/180;
const Lt=0.44, Ls=0.42, Ltr=0.52, KR=Ls/(Ls+Lt);
const TOE=[0.03,-0.06,0.17], HEEL=[0,-0.05,-0.07], MTP=[0.03,-0.06,0.12], TLEN=0.05;
const ANK0=Math.acos(-0.06/Math.hypot(0.06,0.12))/D;

 [11,12],[11,13],[13,15],[15,17],[15,19],[15,21],[17,19],[12,14],[14,16],[16,18],[16,20],[16,22],[18,20],
 [11,23],[12,24],[23,24],[23,25],[24,26],[25,27],[26,28],[27,29],[28,30],[29,31],[30,32],[27,31],[28,32]];
const EX={
  squat:{name:'Kniebeuge',dur:3.6,view:'iso',modes:[['ok','Korrekt'],['valgus','Knievalgus'],['trunk','Rumpfvorlage']],
    note:'Grenzwerte (Platzhalter): Valgus über 10°, Rumpfneigung über 50°.'},
  gait:{name:'Gang',dur:1.15,view:'side',modes:[['ok','Korrekt'],['trend','Trendelenburg'],['drop','Fußheberschwäche']],
    note:'Endloses Gehen, die Kamera läuft mit. Grenzwerte (Platzhalter): Beckenabsinken über 7°, Plantarflexion in der Schwungphase über 12°. Betroffene Seite im Modell: rechts.'},
  single:{name:'Einbeinstand',dur:4,view:'front',modes:[['ok','Korrekt'],['trend','Trendelenburg'],['ankle','Sprunggelenk instabil']],
    note:'Standbein links. Grenzwerte (Platzhalter): Beckenabsinken über 6°, Rückfuß frontal über 8°, Valgus über 10°.'}
};
var GP={d0:-6,d1:10,dm:.40,d2:-14,dp:.61,d3:8,a0:12,a1:24,ash:-.06,k1:66,kw:.15};
const HS=0.055; // Fersenkontakt im Kurvenverlauf
const inStance=c=>c>=HS&&c<0.62;
const bump=(c,m,w)=>{let d=Math.abs(c-m);d=Math.min(d,1-d);return Math.exp(-0.5*(d/w)**2)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// OSG-Verlauf im Gangzyklus (c = 0 Fersenkontakt)
function ankleGait(c){ return GP.d0*bump(c,.06,.035)+GP.d1*bump(c,GP.dm,.1)+GP.d2*bump(c,GP.dp,.06)+GP.d3*bump(c,.86,.08); }
function gaitLeg(c,s,drop){
  let a=GP.a0+GP.a1*Math.cos(2*Math.PI*(c-GP.ash)), kf=5+13*bump(c,.14,.06)+GP.k1*bump(c,.72,GP.kw), d=ankleGait(c);
  if(drop){ const w=bump(c,.82,.11); d-=18*w+GP.d3*bump(c,.86,.08)+6*bump(c,.02,.04); a+=14*w; kf+=26*w; }
  return {a,kf,d,foot:0.09*s,toeFlat:c>0.3&&c<0.64};
}

function leg(hip,s,L){
  const A=L.a*D, B=(L.a-L.kf)*D, F=(L.d+L.a-L.kf)*D, inv=L.inv||0, valg=L.valg||0;
  const knee=V(0,hip.y-Lt*Math.cos(A),hip.z+Lt*Math.sin(A));
  const ankle=V(0,knee.y-Ls*Math.cos(B),knee.z+Ls*Math.sin(B));
  ankle.x=L.foot+s*inv; knee.x=L.foot+(hip.x-L.foot)*KR+s*(2.2*inv-valg);
  const rot=o=>V(L.foot+s*o[0],ankle.y+o[1]*Math.cos(F)+o[2]*Math.sin(F),ankle.z-o[1]*Math.sin(F)+o[2]*Math.cos(F));
  // Vorfuß: Zehen knicken im Grundgelenk ab, sobald die Ferse abhebt (Vorfuß-Rocker)
  const mtp=rot(MTP), tp=L.toeFlat?Math.max(F,0):F, toe=V(L.foot+s*TOE[0],mtp.y+TLEN*Math.sin(tp),mtp.z+TLEN*Math.cos(tp));

}
function build(B){
  const P=new Array(33), ob=B.obl*D;
  const hipL=V(B.px+0.11,1+0.11*Math.sin(ob),0), hipR=V(B.px-0.11,1-0.11*Math.sin(ob),0);
  const lL=leg(hipL,1,B.legs.L), lR=leg(hipR,-1,B.legs.R);
  P[23]=hipL;P[24]=hipR;P[25]=lL.knee;P[26]=lR.knee;P[27]=lL.ankle;P[28]=lR.ankle;P[29]=lL.heel;P[30]=lR.heel;P[31]=lL.toe;P[32]=lR.toe;
  const hipMid=hipL.clone().add(hipR).multiplyScalar(.5), tr=B.trunk*D, tdir=V(0,Math.cos(tr),Math.sin(tr));
  const shMid=hipMid.clone().addScaledVector(tdir,Ltr);
  for(const [s,sh,el,wr,pk,ix,tb,arm] of [[1,11,13,15,17,19,21,B.arms.L],[-1,12,14,16,18,20,22,B.arms.R]]){
    const f=arm.f*D, ab=arm.ab*D, dir=V(s*Math.sin(ab),-Math.cos(ab)*Math.cos(f),Math.cos(ab)*Math.sin(f)).normalize();
    const shoulder=V(hipMid.x+0.19*s,shMid.y,shMid.z), elbow=shoulder.clone().addScaledVector(dir,0.29), wrist=elbow.clone().addScaledVector(dir,0.26);
    P[sh]=shoulder;P[el]=elbow;P[wr]=wrist;
    P[pk]=wrist.clone().addScaledVector(dir,0.08).add(V(0.03*s,0,0));
    P[ix]=wrist.clone().addScaledVector(dir,0.09).add(V(-0.01*s,0,0));
    P[tb]=wrist.clone().addScaledVector(dir,0.05).add(V(-0.04*s,0,0));
  }
  const hc=shMid.clone().addScaledVector(tdir,0.22);
  P[0]=hc.clone().add(V(0,-0.01,0.1));
  [[1,.022],[2,.035],[3,.048]].forEach(([i,x])=>P[i]=hc.clone().add(V(x,.03,.085)));
  [[4,.022],[5,.035],[6,.048]].forEach(([i,x])=>P[i]=hc.clone().add(V(-x,.03,.085)));
  P[7]=hc.clone().add(V(.078,.01,0));P[8]=hc.clone().add(V(-.078,.01,0));
  P[9]=hc.clone().add(V(.025,-.045,.085));P[10]=hc.clone().add(V(-.025,-.045,.085));
  let minY=Infinity; for(const sd of B.stance){const f=sd==='L'?lL:lR; minY=Math.min(minY,f.heel.y,f.toe.y);}
  let dz=0; if(B.anchor==='feet') dz=-(lL.ankle.z+lR.ankle.z)/2; if(B.anchor==='L') dz=-lL.ankle.z;
  const off=V(0,0.02-minY,dz); P.forEach(p=>p.add(off)); hipMid.add(off); shMid.add(off);
  const M={L:lL.mtp.add(off),R:lR.mtp.add(off)};
  return {P,hipMid,shMid,M};
}
function params(ex,p,mode){
  if(ex==='squat'){ const t=(1-Math.cos(2*Math.PI*p))/2;
    const L=s=>({a:95*t,kf:127*t,d:32*t,foot:0.14*s,valg:mode==='valgus'?0.09*t:-0.03*t});
    return {px:0,obl:0,trunk:(mode==='trunk'?68:36)*t,legs:{L:L(1),R:L(-1)},arms:{L:{f:12+78*t,ab:5},R:{f:12+78*t,ab:5}},stance:['L','R'],anchor:'feet',cyc:{}}; }
  if(ex==='gait'){ const cR=(p+HS)%1, cL=(p+0.5+HS)%1, sn=Math.sin(2*Math.PI*p);
    let obl=-4*sn; if(mode==='trend'&&sn>0) obl-=10*sn;
    return {px:-0.025*sn,obl,trunk:4,legs:{L:gaitLeg(cL,1,false),R:gaitLeg(cR,-1,mode==='drop')},
      arms:{L:{f:6+16*Math.cos(2*Math.PI*cR),ab:6},R:{f:6+16*Math.cos(2*Math.PI*cL),ab:6}},stance:['L','R'],anchor:null,cyc:{L:cL,R:cR}}; }
  const t=(1-Math.cos(2*Math.PI*p))/2, inv=mode==='ankle'?(0.028*t+0.006*Math.sin(6*Math.PI*p)*t):0;
  return {px:0.07+0.008*Math.sin(2*Math.PI*p),obl:mode==='trend'?2+9*t:-1+0.8*Math.sin(2*Math.PI*p),trunk:3,
    legs:{L:{a:2,kf:4,d:2+1.5*Math.sin(4*Math.PI*p),foot:0.1,inv},R:{a:50,kf:85,d:5,foot:-0.12}},
    arms:{L:{f:10,ab:22},R:{f:10,ab:22}},stance:['L'],anchor:'L',cyc:{}};
}
// Vorwärtsweg pro Gangzyklus: der jeweils tiefste Fußpunkt bleibt am Boden stehen (kein Rutschen)
function strideTable(mode){
  const N=480, T=new Float32Array(N+1); let acc=0;
  for(let i=0;i<N;i++){
    const pa=params('gait',i/N,mode), A=build(pa).P, Bn=build(params('gait',(i+1)/N,mode)).P;
    const cand=[]; if(inStance(pa.cyc.L)) cand.push(29,31); if(inStance(pa.cyc.R)) cand.push(30,32); if(!cand.length) cand.push(29,30,31,32);
    let piv=cand[0]; for(const k of cand) if(A[k].y<A[piv].y) piv=k;
    acc+=-(Bn[piv].z-A[piv].z); T[i+1]=acc;
  }
  return {T,N,S:acc};
}
const ang=(a,b,c)=>a.clone().sub(b).angleTo(c.clone().sub(b))/D, yz=v=>V(0,v.y,v.z);
function measures(R){
  const {P,hipMid,shMid,M}=R, m={};
  for(const [k,h,kn,an,he,to,sh,s] of [['L',23,25,27,29,31,11,1],['R',24,26,28,30,32,12,-1]]){
    const u=P[h].clone().sub(P[sh]), w=P[kn].clone().sub(P[h]);
    m['h'+k]=-Math.atan2(u.y*w.z-u.z*w.y,u.y*w.y+u.z*w.z)/D;
    m['k'+k]=180-ang(P[h],P[kn],P[an]);
    const H=V(P[h].x,P[h].y,0),K=V(P[kn].x,P[kn].y,0),A=V(P[an].x,P[an].y,0);
    const dev=180-ang(H,K,A), tt=(K.y-A.y)/((H.y-A.y)||1e-6), lx=A.x+(H.x-A.x)*tt;
    m['v'+k]=(lx-K.x)*s>0?dev:-dev;
    m['a'+k]=ANK0-ang(yz(P[kn]),yz(P[an]),yz(M[k]));
    m['f'+k]=(Math.atan2((P[kn].x-P[he].x)*s,P[kn].y-P[he].y)-Math.atan2((P[h].x-P[he].x)*s,P[h].y-P[he].y))/D;
  }
  m.ob=Math.atan2(P[23].y-P[24].y,P[23].x-P[24].x)/D;
  m.tr=shMid.clone().sub(hipMid).angleTo(V(0,1,0))/D;
  return m;
}
const SIDE={L:'links',R:'rechts'};
function rules(ex,m,cyc){
  const f={}, iss=[];
  if(ex==='squat'){
    for(const k of ['L','R']) if(m['v'+k]>10) f['knee'+k]=1;
    if(f.kneeL||f.kneeR) iss.push(['valg','Knie fallen nach innen. Knie über die Fußspitzen ausrichten.']);
    if(m.tr>50){ f.trunk=1; iss.push(['trunk','Oberkörper kippt zu weit nach vorn. Brust aufrichten, Gewicht auf die Fersen.']); }
  }
  if(ex==='gait'){
    if(Math.abs(m.ob)>7){ f.pelvis=1; const low=m.ob>0?'R':'L', st=low==='R'?'L':'R';
      iss.push(['trend'+st,`Becken sinkt ${SIDE[low]} ab, während ${SIDE[st]} das Standbein ist: Trendelenburg-Zeichen. Hüftabduktoren ${SIDE[st]} prüfen.`]); }
    for(const k of ['L','R']){ const c=cyc[k]; if(c>0.68&&c<0.97&&m['a'+k]<-12){ f['ankle'+k]=1;
      iss.push(['drop'+k,`Fuß hängt in der Schwungphase ${SIDE[k]}: Fußheberschwäche, ausgeglichen durch vermehrte Hüft- und Kniebeugung (Steppergang).`]); } }
  }
  if(ex==='single'){
    if(Math.abs(m.ob)>6){ f.pelvis=1; iss.push(['trend','Becken sinkt auf der Spielbeinseite ab: Trendelenburg-Zeichen. Hüftabduktoren links prüfen.']); }
    if(Math.abs(m.fL)>8){ f.ankleL=1; iss.push(['ankle',m.fL>0?'Sprunggelenk links kippt in die Supination: Stabilität und Propriozeption prüfen.':'Rückfuß links kippt in die Pronation: Fußgewölbe und Stabilität prüfen.']); }
    if(m.vL>10){ f.kneeL=1; iss.push(['valg','Knie links fällt nach innen.']); }
  }
  return {f,iss};
}
// Federfunktion: Spannung der Achillessehne (lädt im Sprunggelenk-Rocker, entlädt beim Abdruck)
function springT(c,dors){ return (c>=HS&&c<0.64)?clamp((dors+3)/13,0,1):0; }
function rocker(c){ return c<HS?'Schwungphase: Fuß setzt gleich auf':c<0.15?'Fersen-Rocker: Aufsetzen und Abbremsen':c<0.46?'Sprunggelenk-Rocker: Feder lädt':c<0.64?'Vorfuß-Rocker: Abdruck, Feder entlädt':'Schwungphase: Fuß wird angehoben'; }

let root=null, R3=null, st=null;
function html(){ return `
<div class="card bwa-stage" data-r="stage"><canvas aria-label="3D-Skelettmodell"></canvas><div class="bwa-labels" data-r="labels" hidden></div>
  <div class="bwa-head"><h2 data-r="title">Kniebeuge</h2><p>33 Gelenkpunkte nach MediaPipe-Schema. Ziehen zum Drehen, Pinch oder Mausrad zum Zoomen.</p></div>
  <div class="bwa-views" data-r="views">${[['front','Vorne'],['back','Hinten'],['side','Seitlich'],['iso','3D']].map(([k,l])=>`<button data-view="${k}">${l}</button>`).join('')}</div></div>
<div class="bwa-status ok" data-r="status"><strong>Ausführung korrekt</strong><p>Alle Winkel im Sollbereich.</p></div>
<div class="card"><h2>Übung</h2>
  <div class="bwa-chips ex" data-r="exs">${Object.entries(EX).map(([k,e])=>`<button data-ex="${k}">${e.name}</button>`).join('')}</div>
  <div class="bwa-chips" data-r="modes"></div>
  <div class="bwa-row"><button class="btn" data-r="play">Pause</button><input type="range" min="0" max="100" value="0" data-r="slider" aria-label="Bewegungsphase"><span class="bwa-pv" data-r="pv">0 %</span></div>
  <p class="muted bwa-info" data-r="info"></p></div>
<div class="card" data-r="spring"><h2>Federfunktion Sprunggelenk</h2>
  <p class="muted" style="margin:0 0 8px">Beim Abrollen dehnt sich die Achillessehne wie eine Feder (Dorsalextension unter Last) und gibt die Energie beim Abdruck wieder ab.</p>
  <svg viewBox="0 0 320 120" width="100%" data-r="plot" role="img" aria-label="OSG-Winkel im Gangzyklus"></svg>
  <table class="bwa-tbl" style="margin-top:6px"><tr><th>Phase</th><th>Spannung</th></tr>
  <tr><td>Links<small data-r="rkL"></small></td><td data-r="tL">–</td></tr><tr><td>Rechts<small data-r="rkR"></small></td><td data-r="tR">–</td></tr></table>
  <label class="bwa-chk"><input type="checkbox" data-r="springChk" checked> Achillessehne als Feder zeigen</label></div>
<div class="card"><h2>Messwerte</h2><table class="bwa-tbl"><tr><th>Winkel</th><th>Links</th><th>Rechts</th></tr>
  <tr class="grp"><td colspan="3">Hüfte und Becken</td></tr>
  <tr><td>Hüftbeugung<small>+ Flexion, − Extension</small></td><td data-r="hL"></td><td data-r="hR"></td></tr>
  <tr><td>Beckenschiefstand</td><td colspan="2" data-r="ob"></td></tr>
  <tr><td>Rumpfneigung</td><td colspan="2" data-r="tr"></td></tr>
  <tr class="grp"><td colspan="3">Knie</td></tr>
  <tr><td>Kniebeugung</td><td data-r="kL"></td><td data-r="kR"></td></tr>
  <tr><td>Knie-Valgus frontal<small>+ Valgus, − Varus</small></td><td data-r="vL"></td><td data-r="vR"></td></tr>
  <tr class="grp"><td colspan="3">Sprunggelenk</td></tr>
  <tr><td>OSG sagittal<small>+ Dorsal-, − Plantarflexion</small></td><td data-r="aL"></td><td data-r="aR"></td></tr>
  <tr><td>Rückfuß frontal<small>+ Supination, − Pronation</small></td><td data-r="fL"></td><td data-r="fR"></td></tr></table></div>
<div class="card"><h2>Anzeige</h2>
  <label class="bwa-chk"><input type="checkbox" data-r="ghostChk" checked> Soll-Bewegung einblenden</label>
  <label class="bwa-chk"><input type="checkbox" data-r="numsChk"> Punktnummern zeigen</label>
  <p class="muted" data-r="note" style="margin:8px 0 0"></p></div>`; }

function init(){
  root=document.createElement('div'); root.className='bwa'; root.innerHTML=html();
  const q=n=>root.querySelector(`[data-r="${n}"]`);
  const stage=q('stage'), canvas=stage.querySelector('canvas');
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(38,1,0.05,60);
  scene.add(new THREE.HemisphereLight(0xffffff,0x667780,0.85)); const dl=new THREE.DirectionalLight(0xffffff,0.6); dl.position.set(2,4,3); scene.add(dl);
  const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const mats={bone:new THREE.MeshStandardMaterial({roughness:.55}),warn:new THREE.MeshStandardMaterial({roughness:.5}),joint:new THREE.MeshStandardMaterial({roughness:.4})};
  const ghostMat=new THREE.LineBasicMaterial({transparent:true,opacity:.8});
  const floorMat=new THREE.MeshBasicMaterial({transparent:true,opacity:.55});
  const springMats=[new THREE.LineBasicMaterial(),new THREE.LineBasicMaterial()];
  let grid; const cSoft=new THREE.Color(), cHot=new THREE.Color();
  function theme(){ mats.bone.color.set(css('--ink')); mats.warn.color.set(css('--bad')); mats.joint.color.set(css('--pine'));
    ghostMat.color.set(css('--soft')); floorMat.color.set(css('--surface')); cSoft.set(css('--soft')); cHot.set(css('--amber'));
    if(grid) scene.remove(grid); grid=new THREE.GridHelper(8,32,new THREE.Color(css('--line-strong')),new THREE.Color(css('--line-strong'))); grid.position.y=0.001; scene.add(grid); }
  const floor=new THREE.Mesh(new THREE.CircleGeometry(3.2,64),floorMat); floor.rotation.x=-Math.PI/2; scene.add(floor); theme();
  const jg=new THREE.SphereGeometry(1,16,12), bg=new THREE.CylinderGeometry(1,1,1,10);
  const joints=[]; for(let i=0;i<33;i++){const m=new THREE.Mesh(jg,mats.joint); m.scale.setScalar(i<=10?0.012:(i>=17&&i<=22)?0.01:0.022); scene.add(m); joints.push(m);}
  const bones=CONN.map(()=>{const m=new THREE.Mesh(bg,mats.bone); scene.add(m); return m;});
  const gGeo=new THREE.BufferGeometry(); gGeo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(CONN.length*6),3));
  const ghost=new THREE.LineSegments(gGeo,ghostMat); scene.add(ghost);
  const NS=90, springs=springMats.map(mt=>{const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(NS*3),3)); const l=new THREE.Line(g,mt); scene.add(l); return l;});
  const up=V(0,1,0);
  const place=(m,a,b,r)=>{const d=b.clone().sub(a),L=d.length(); m.position.copy(a).addScaledVector(d,.5); m.scale.set(r,L,r); m.quaternion.setFromUnitVectors(up,d.normalize());};
  const has=(i,a,b)=>{const [x,y]=CONN[i];return (x===a&&y===b)||(x===b&&y===a)};
  const GROUPS={kneeL:[[23,25],[25,27]],kneeR:[[24,26],[26,28]],ankleL:[[25,27],[27,29],[29,31],[27,31]],ankleR:[[26,28],[28,30],[30,32],[28,32]],pelvis:[[23,24]],trunk:[[11,23],[12,24]]};
  const JG={kneeL:[25],kneeR:[26],ankleL:[27],ankleR:[28],pelvis:[23,24]};
  const boneGroup=CONN.map((_,i)=>Object.keys(GROUPS).filter(g=>GROUPS[g].some(([a,b])=>has(i,a,b))));
  const labels=q('labels'), labelEls=[]; for(let i=0;i<33;i++){const s=document.createElement('span'); s.textContent=i; labels.appendChild(s); labelEls.push(s);}

  // Kamera
  const target=V(0,0.85,0.05), view={theta:35*D,phi:78*D,r:3.4}, goal={...view};
  const presets={front:{theta:0,phi:84*D},back:{theta:180*D,phi:84*D},side:{theta:90*D,phi:84*D},iso:{theta:35*D,phi:72*D}};
  const setView=n=>{Object.assign(goal,presets[n]); q('views').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.view===n));};
  q('views').querySelectorAll('button').forEach(b=>b.onclick=()=>setView(b.dataset.view));
  const ptrs=new Map(); let pinch0=0,r0=0;
  canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(ptrs.size===2){const [p,q2]=[...ptrs.values()]; pinch0=Math.hypot(p.x-q2.x,p.y-q2.y); r0=goal.r;}});
  canvas.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)) return; const p=ptrs.get(e.pointerId);
    if(ptrs.size===1){ goal.theta-=(e.clientX-p.x)*0.008; goal.phi=clamp(goal.phi-(e.clientY-p.y)*0.006,15*D,95*D); q('views').querySelectorAll('button').forEach(b=>b.classList.remove('on')); }
    p.x=e.clientX; p.y=e.clientY; if(ptrs.size===2){const [a,b]=[...ptrs.values()]; goal.r=clamp(r0*pinch0/Math.hypot(a.x-b.x,a.y-b.y),1.4,8);} });
  const end=e=>ptrs.delete(e.pointerId); canvas.addEventListener('pointerup',end); canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('wheel',e=>{e.preventDefault(); goal.r=clamp(goal.r*(1+e.deltaY*0.001),1.4,8);},{passive:false});

  // Zustand
  st={ex:'squat',mode:'ok',playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,p:0,cycles:0,table:null,ghostTable:null,latch:new Map(),lastKey:''};
  const play=q('play'), slider=q('slider');
  const setPlay=v=>{st.playing=v; play.textContent=v?'Pause':'Abspielen';}; setPlay(st.playing);
  play.onclick=()=>setPlay(!st.playing);
  slider.oninput=()=>{setPlay(false); st.p=(slider.value/100)%1;};
  function plot(){
    const svg=q('plot'), W=320,H=120,x0=30,x1=312,y=v=>60-v*2.2, X=c=>x0+(x1-x0)*c;
    let d=''; for(let i=0;i<=120;i++){const c=i/120; const L=gaitLeg(c,-1,st.mode==='drop'); d+=(i?'L':'M')+X(c).toFixed(1)+' '+y(L.d).toFixed(1);}
    const zone=(a,b,l)=>`<rect x="${X(a)}" y="8" width="${X(b)-X(a)}" height="${H-26}" fill="var(--tint)" opacity="${l}"/>`;
    svg.innerHTML=`${zone(HS,.15,.9)}${zone(.15,.46,.45)}${zone(.46,.62,.9)}
      <line x1="${x0}" x2="${x1}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
      <text x="4" y="${y(10)+4}" font-size="10" fill="var(--soft)">+10°</text><text x="4" y="${y(-10)+4}" font-size="10" fill="var(--soft)">−10°</text>
      <path d="${d}" fill="none" stroke="var(--pine)" stroke-width="2"/>
      <text x="${X(.1)}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--soft)">Ferse</text>
      <text x="${X(.29)}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--soft)">Feder lädt</text>
      <text x="${X(.55)}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--soft)">Abdruck</text>
      <text x="${X(.81)}" y="${H-4}" font-size="9" text-anchor="middle" fill="var(--soft)">Schwung</text>
      <circle r="5" data-d="L" fill="var(--amber)"/><circle r="5" data-d="R" fill="var(--pine)"/>
      <text x="${x1}" y="16" font-size="10" text-anchor="end" fill="var(--soft)">Punkt grün: rechts, orange: links</text>`;
    st.plotXY={X,y};
  }
  function setMode(m){ st.mode=m; q('modes').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.mode===m)); st.latch.clear();
    if(st.ex==='gait'){ st.table=strideTable(m); st.ghostTable=strideTable('ok'); plot(); } }
  function setEx(e){ st.ex=e; st.p=0; st.cycles=0; st.latch.clear();
    q('exs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.ex===e));
    const ms=q('modes'); ms.innerHTML=EX[e].modes.map(([k,l])=>`<button data-mode="${k}">${l}</button>`).join('');
    ms.querySelectorAll('button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
    q('spring').hidden=e!=='gait'; setMode('ok'); q('title').textContent=EX[e].name;
    q('note').textContent=EX[e].note+' Alle Grenzwerte sollten klinisch festgelegt werden.'; setView(EX[e].view); }
  q('exs').querySelectorAll('button').forEach(b=>b.onclick=()=>setEx(b.dataset.ex));
  q('numsChk').onchange=()=>labels.hidden=!q('numsChk').checked;

  const fmt=v=>(v>0.5?'+':'')+Math.round(v)+'°', fmtU=v=>Math.round(v)+'°';
  const tableAt=(tb,p)=>{const f=p*tb.N,i=Math.floor(f),t=f-i; return tb.T[i]+(tb.T[Math.min(i+1,tb.N)]-tb.T[i])*t;};
  let last=performance.now(); const tmp=V(0,0,0); let lastPv=-1;

  function frame(now){
    requestAnimationFrame(frame);
    if(!root.isConnected){ last=now; return; }
    const w=stage.clientWidth,h=stage.clientHeight;
    if(canvas.width!==Math.round(w*renderer.getPixelRatio())||canvas.height!==Math.round(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
    const dt=Math.min((now-last)/1000,0.05); last=now;
    if(st.playing){ st.p+=dt/EX[st.ex].dur; if(st.p>=1){ st.p-=1; st.cycles++; } }
    const pv=Math.round(st.p*100); if(pv!==lastPv){ lastPv=pv; slider.value=pv; q('pv').textContent=pv+' %'; }
    const ex=st.ex, B=params(ex,st.p,st.mode), R=build(B);
    let wz=0; if(ex==='gait'){ wz=st.cycles*st.table.S+tableAt(st.table,st.p); R.P.forEach(p=>p.z+=wz); R.M.L.z+=wz; R.M.R.z+=wz; R.hipMid.z+=wz; R.shMid.z+=wz; }
    const m=measures(R), {f,iss}=rules(ex,m,B.cyc);

    // Werte
    for(const k of ['hL','hR','vL','vR','aL','aR','fL','fR']) q(k).textContent=fmt(m[k]);
    q('kL').textContent=fmtU(m.kL); q('kR').textContent=fmtU(m.kR); q('tr').textContent=fmtU(m.tr);
    const o=Math.round(Math.abs(m.ob)); q('ob').textContent=o===0?'0°':o+'° '+(m.ob>0?'rechts':'links')+' tiefer';
    const bad={vL:f.kneeL,vR:f.kneeR,aL:f.ankleL&&ex==='gait',aR:f.ankleR&&ex==='gait',fL:f.ankleL&&ex==='single',fR:f.ankleR&&ex==='single',ob:f.pelvis,tr:f.trunk};
    for(const id in bad) q(id).classList.toggle('bad',!!bad[id]);
    const hold=ex==='gait'?1600:300; iss.forEach(([k,t])=>st.latch.set(k,{t,until:now+hold}));
    for(const [k,v] of st.latch) if(v.until<now) st.latch.delete(k);
    const list=[...st.latch.values()].map(v=>v.t), key=list.join('|');
    if(key!==st.lastKey){ st.lastKey=key; const s=q('status'); s.className='bwa-status '+(list.length?'warn':'ok');
      s.innerHTML=list.length?'<strong>Korrektur nötig</strong><ul>'+list.map(i=>'<li>'+i+'</li>').join('')+'</ul>':'<strong>Ausführung korrekt</strong><p>Alle Winkel im Sollbereich.</p>'; }
    q('info').textContent=ex==='gait'?`Links: ${inStance(B.cyc.L)?'Standbein':'Schwungbein'}, rechts: ${inStance(B.cyc.R)?'Standbein':'Schwungbein'}. Zurückgelegt: ${wz.toFixed(1)} m`
      :ex==='squat'?'Tiefe '+Math.round((1-Math.cos(2*Math.PI*st.p))/2*100)+' %':'Standbein links, Spielbein rechts';

    // Skelett
    R.P.forEach((pt,i)=>{joints[i].position.copy(pt); joints[i].material=mats.joint;});
    for(const g in JG) if(f[g]) JG[g].forEach(i=>joints[i].material=mats.warn);
    CONN.forEach(([a,b],i)=>{ const r=(a<=10&&b<=10)||(a>=15&&b>=15&&a<=22&&b<=22)?0.005:0.011; place(bones[i],R.P[a],R.P[b],r); bones[i].material=boneGroup[i].some(g=>f[g])?mats.warn:mats.bone; });

    // Feder (Achillessehne)
    const showS=ex==='gait'&&q('springChk').checked;
    [['L',25,27,29,0],['R',26,28,30,1]].forEach(([k,kn,an,he,idx])=>{
      const line=springs[idx]; line.visible=showS; if(ex!=='gait') return;
      const T=springT(B.cyc[k],m['a'+k]);
      q('t'+k).textContent=Math.round(T*100)+' %'; q('rk'+k).textContent=rocker(B.cyc[k]);
      if(st.plotXY){ const c=q('plot').querySelector(`[data-d="${k}"]`); c.setAttribute('cx',st.plotXY.X(B.cyc[k])); c.setAttribute('cy',st.plotXY.y(m['a'+k])); }
      if(!showS) return;
      const sd=R.P[an].clone().sub(R.P[kn]).normalize(), post=V(0,-sd.z,sd.y);
      const A=R.P[kn].clone().lerp(R.P[an],0.45).addScaledVector(post,0.045), Hh=R.P[he].clone().add(V(0,0.03,0.01));
      const ax=Hh.clone().sub(A), axn=ax.clone().normalize(), e1=V(1,0,0), e2=axn.clone().cross(e1).normalize();
      const amp=0.022*(1-0.55*T), turns=7, arr=line.geometry.attributes.position.array;
      for(let i=0;i<NS;i++){ const u=i/(NS-1), th=u*turns*2*Math.PI, env=Math.sin(Math.PI*u)**0.35;
        const pnt=A.clone().addScaledVector(ax,u).addScaledVector(e1,Math.cos(th)*amp*env).addScaledVector(e2,Math.sin(th)*amp*env); arr.set([pnt.x,pnt.y,pnt.z],i*3); }
      line.geometry.attributes.position.needsUpdate=true; line.geometry.computeBoundingSphere();
      springMats[idx].color.copy(cSoft).lerp(cHot,T);
    });

    // Soll-Bewegung
    ghost.visible=q('ghostChk').checked&&st.mode!=='ok';
    if(ghost.visible){ const G=build(params(ex,st.p,'ok')).P, arr=gGeo.attributes.position.array;
      const gOff=ex==='gait'?(R.hipMid.z-G[23].clone().add(G[24]).multiplyScalar(.5).z):0;
      CONN.forEach(([a,b],i)=>arr.set([G[a].x,G[a].y,G[a].z+gOff,G[b].x,G[b].y,G[b].z+gOff],i*6)); gGeo.attributes.position.needsUpdate=true; gGeo.computeBoundingSphere(); }

    // Boden mitführen, Kamera folgt
    const cell=0.25; grid.position.z=Math.round(wz/cell)*cell; floor.position.z=wz;
    target.z+=((wz+0.05)-target.z)*0.15;
    let dth=goal.theta-view.theta; dth=Math.atan2(Math.sin(dth),Math.cos(dth));
    view.theta+=dth*0.12; view.phi+=(goal.phi-view.phi)*0.12; view.r+=(goal.r-view.r)*0.12;
    cam.position.set(target.x+view.r*Math.sin(view.phi)*Math.sin(view.theta),target.y+view.r*Math.cos(view.phi),target.z+view.r*Math.sin(view.phi)*Math.cos(view.theta));
    cam.lookAt(target); renderer.render(scene,cam);
    if(q('numsChk').checked) R.P.forEach((pt,i)=>{tmp.copy(pt).project(cam); labelEls[i].style.left=((tmp.x+1)/2*w)+'px'; labelEls[i].style.top=((1-tmp.y)/2*h)+'px';});
  }
  setEx('squat'); requestAnimationFrame(frame);
}
return {mount(slot){ if(!window.THREE){ slot.innerHTML='<div class="card"><p class="muted">3D-Bibliothek konnte nicht geladen werden. Bitte Seite neu laden.</p></div>'; return; }
  if(!root) init(); if(root.parentNode!==slot) slot.appendChild(root); }};
})();

</script>
